<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FFD – Flunkyball Freunde Düsseldorf</title>
<meta name="theme-color" content="#1a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FFD">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icons/favicon-48-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<style>
:root{
  --bg:#140a14; --bg2:#1f0f1e; --card:#2a1528; --card2:#341a32; --line:#4a2747;
  --text:#f4eef4; --muted:#b9a6b8; --gold:#f7c51e; --gold2:#ffdc5c; --silver:#cfd3dc; --bronze:#d08a4a;
  --ok:#4fd18b; --bad:#ff6b6b; --purple:#5a2a57;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#3a1838 0%,var(--bg) 60%) fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(90px + var(--safe-b))}
header{position:sticky;top:0;z-index:20;background:rgba(20,10,20,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06);padding-top:var(--safe-t)}
.hbar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.hbar img{width:42px;height:40px;object-fit:contain}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:17px;letter-spacing:.2px;font-style:italic;font-weight:800}
.htitle span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;display:flex;align-items:center;gap:6px;font-size:14px}
.lockbtn.on{background:var(--gold);color:#241022;border-color:var(--gold);font-weight:700}
.lockbtn svg{width:16px;height:16px}

.hero{text-align:center;padding:18px 0 6px}
.hero img{width:150px;max-width:44vw;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none;position:sticky;top:calc(57px + var(--safe-t));z-index:10;background:linear-gradient(var(--bg) 75%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--gold);border-color:var(--gold);color:#241022}
.chip small{opacity:.7;font-weight:500;margin-left:4px}

.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:8px 0 14px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 10px;text-align:center;min-width:0}
.pod .medal{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;color:#241022;font-size:15px}
.pod.p1{padding-top:18px;border-color:rgba(247,197,30,.55);background:linear-gradient(180deg,#3d2236,var(--card))}
.pod.p1 .medal{background:var(--gold);width:36px;height:36px;font-size:18px}
.pod.p2 .medal{background:var(--silver)}
.pod.p3 .medal{background:var(--bronze)}
.pod .nm{font-weight:700;font-size:14px;line-height:1.2;word-break:break-word}
.pod .tm{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;color:var(--gold2);margin-top:4px}
.pod.p1 .tm{font-size:24px}

.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none}
.search svg{width:18px;height:18px;opacity:.6}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid rgba(255,255,255,.05);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .pl{width:30px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.row .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row .tm{font-variant-numeric:tabular-nums;font-weight:700}
.row.me{background:rgba(247,197,30,.08)}
.row.click:active{background:rgba(255,255,255,.05)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.meta{color:var(--muted);font-size:12px;text-align:center;margin:14px 0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.statinfo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.statinfo b{font-size:15px}
.statinfo span{color:var(--muted);font-size:13px}
.thead{display:flex;gap:10px;padding:8px 14px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.thead .nm{flex:1}.thead .c{width:62px;text-align:right}
.row .c{width:62px;text-align:right;font-variant-numeric:tabular-nums}
.row .c.big{font-weight:800;color:var(--gold2)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,10,20,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.07);padding-bottom:var(--safe-b)}
nav.tabs div{max-width:720px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 9px;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--gold)}

.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(76px + var(--safe-b));z-index:25;border:0;background:var(--gold);color:#241022;font-weight:800;border-radius:999px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px;font-size:15px}
.fab svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--bg2);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--line);border-bottom:0;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(22px + var(--safe-b));max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.xbtn{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);color:var(--muted);font-size:16px;z-index:2}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet p.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--gold)}
textarea.inp{resize:vertical;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--card2);width:100%;margin-top:8px}
.btn.pri{background:var(--gold);color:#241022}
.btn.danger{background:transparent;border:1px solid rgba(255,107,107,.5);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.menu .btn{text-align:left;display:flex;align-items:center;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.check{display:flex;gap:10px;align-items:center;font-size:14px;margin:6px 0}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sugg button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.sel{display:flex;align-items:center;gap:8px;background:rgba(247,197,30,.12);border:1px solid rgba(247,197,30,.4);border-radius:10px;padding:10px 12px}
.sel span{flex:1;font-weight:600}
.sel button{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px}
.seg button.on{background:var(--gold);color:#241022;border-color:var(--gold);font-weight:700}

.bigstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.bigstat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.bigstat b{display:block;font-size:20px;white-space:nowrap;color:var(--gold2);font-variant-numeric:tabular-nums}
.bigstat span{font-size:12px;color:var(--muted)}
.blk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.blk .n{width:84px;color:var(--muted);font-size:13px}
.blk .b{flex:1}
.blk .v{width:96px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.h{background:var(--ok);border-color:var(--ok)}
.dots i.m{background:var(--bad);border-color:var(--bad)}
.dots i.p{box-shadow:0 0 0 2px rgba(247,197,30,.6)}
.hitbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hitbtns button{border:0;border-radius:16px;padding:26px 0;font-size:20px;font-weight:800}
.hitbtns .h{background:var(--ok);color:#06210f}
.hitbtns .m{background:var(--bad);color:#2a0606}
.counter{text-align:center;font-size:15px;color:var(--muted)}
.counter b{color:var(--text)}

.chart{margin:10px 0 4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:rgba(255,255,255,.07);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--gold);stroke:var(--card);stroke-width:2}
.chart .ln.raw{stroke-width:2;opacity:1}
.chart .trend{fill:none;stroke:#f4eef4;stroke-width:1.5;opacity:.35;stroke-dasharray:4 4}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend .lr{background:var(--gold)}.legend .lt{opacity:.5;background:repeating-linear-gradient(90deg,#f4eef4 0 4px,transparent 4px 8px)}
.kpis.click div{cursor:pointer}.kpis.click div:active{background:var(--card2)}
.kpihint{font-size:11px;color:var(--muted);text-align:center;margin:-4px 0 10px}
.chart .pt.best{fill:var(--gold2)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .tip{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.chart .tip.on{color:var(--text);font-weight:600}
.att{margin-top:6px;border-top:1px solid rgba(255,255,255,.06)}
.att button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.04);padding:8px 2px;text-align:left;font-size:14px}
.att button:disabled{color:inherit;opacity:1;cursor:default}
.att .pn{flex:1;color:var(--muted);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#fff;color:#1a0e1a;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:none;place-items:center}
.busy.on{display:grid}
.busy div{background:var(--bg2);border:1px solid var(--line);padding:16px 20px;border-radius:14px;display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:rgba(247,197,30,.12);border:1px solid rgba(247,197,30,.35);color:var(--gold2);border-radius:12px;padding:9px 12px;font-size:13px;margin:10px 0 0;display:flex;gap:8px;align-items:center}
.hidden{display:none!important}
</style>
<style>
.ctl{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ctl label{width:84px;font-size:12px;color:var(--muted);font-weight:600;flex:none}.ctl .seg{flex:1}
.ctl .seg button{padding:8px 6px;font-size:13px}
#allList .row .c{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
#allList .row .c.big{font-weight:800;color:var(--gold2);font-size:15px}
#allList .row,#allList .thead{gap:6px;padding-left:10px;padding-right:10px}#allList .pl{width:22px}
.sw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 12px;text-align:center}
.swd{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.1}
.swb{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:6px}.swb .btn{margin-top:0;font-size:18px}
.swb .btn.stop{background:var(--bad);color:#fff}
.pens{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pens button{flex:1;min-width:48px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 4px;font-weight:700}
.pens button:active{background:var(--gold);color:#241022}.pens .inp{flex:1.4;min-width:70px;padding:9px}
.penline{font-size:13px;color:var(--muted);margin-bottom:6px}.penline b{color:var(--text)}
.mini{border:0;background:var(--card2);color:var(--muted);border-radius:6px;padding:1px 6px;font-size:12px}
.annul{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.3);border-radius:10px;padding:8px 10px}.annul small{color:var(--muted)}
.rules{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.rules summary{cursor:pointer;font-weight:600;font-size:14px}.rules summary small{color:var(--muted);font-weight:400}
.rules>div{margin-top:8px;font-size:14px;line-height:1.5;color:var(--text)}
.sect{font-size:15px;margin:18px 2px 8px;letter-spacing:.2px}.sect small{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;display:block}
.ocard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ocard .top b{font-size:16px}.ocard .top span{font-size:12px;color:var(--muted)}
.ocard .rec{margin-top:4px;font-size:14px;color:var(--muted)}.ocard .rec b{color:var(--gold2)}
.ocard .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ocard .kp div{background:rgba(255,255,255,.04);border-radius:10px;padding:6px;text-align:center}
.ocard .kp div b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.ocard .kp div span{font-size:11px;color:var(--muted)}
.feed .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none;font-size:15px}
.years{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.ychip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.ychip.on{background:var(--card2);color:var(--text);border-color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.kpis b{display:block;font-size:16px;font-variant-numeric:tabular-nums;color:var(--text)}
.kpis span{font-size:11px;color:var(--muted)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;margin-left:4px}
.nick{color:var(--gold2);font-weight:600}
.pend{border:1px dashed rgba(247,197,30,.45);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:rgba(247,197,30,.05)}
.pend .who{font-size:12px;color:var(--muted)}
.pend .acts{display:flex;gap:8px;margin-top:8px}
.pend .acts button{flex:1;border:0;border-radius:10px;padding:9px;font-weight:700}
.ok{background:var(--ok);color:#06210f}.no{background:transparent;border:1px solid var(--line)!important;color:var(--muted)}
.row .nm{white-space:nowrap}
.trash{margin-left:8px;padding:4px 6px;border-radius:8px;cursor:pointer;opacity:.75;flex:none}
.trash:hover{opacity:1;background:rgba(255,107,107,.15)}
.thead .c,.row .c{width:52px;white-space:nowrap;font-size:13px}
#throwList .row,#throwList .thead{gap:6px;padding-left:10px;padding-right:10px}
#throwList .pl{width:20px}
#throwList .thead{letter-spacing:0;font-size:11px}
.game .prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}
.game .prow .nm{flex:1;min-width:0}
.game .prow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .prow .nm small{color:var(--muted);font-size:12px}
.game .gb{width:58px;height:52px;border:0;border-radius:14px;font-size:24px;font-weight:900;flex:none}
.game .gh{background:var(--ok);color:#06210f}.game .gm{background:var(--bad);color:#2a0606}
.game .gu{width:38px;height:52px;border:1px solid var(--line);background:transparent;border-radius:12px;color:var(--muted);flex:none}
.game .last{display:flex;gap:3px;margin-top:4px}
.game .last i{width:8px;height:8px;border-radius:50%;display:block}
.game .last i.h{background:var(--ok)}.game .last i.m{background:var(--bad)}
.game .prow{flex-wrap:wrap}.wpb{flex-basis:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.wpb .inp{width:64px;padding:6px 8px}.wpb .ok2{background:var(--gold);color:#241022;font-weight:700;padding:6px 10px}.wpb .bchip{background:var(--card2);color:var(--text);padding:4px 8px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.picks button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.picks button.on{background:var(--gold);color:#241022;border-color:var(--gold);font-weight:700}
.stick{position:sticky;bottom:calc(-22px - var(--safe-b));background:var(--bg2);padding:8px 0 calc(10px + var(--safe-b));margin-top:8px}

/* Turniere */

<script>
'use strict';
/* =====================================================================
   FFD-App · Turniere (Flunkyball & Bierpong)
   Daten: data/turniere/index.json  (Liste, Vorlagen, Zusammenfassungen)
          data/turniere/<id>.json   (ein Turnier komplett)
   ===================================================================== */

/* ===================== ENGINE (ohne Oberfläche) ===================== */
const TE = {};
TE.rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
TE.shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = TE.rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
TE.seedOrder = P => { let o = [1]; while (o.length < P) { const n = o.length * 2 + 1; o = o.flatMap(x => [x, n - x]); } return o; };

/* Jeder gegen jeden (Kreisverfahren) – Runden mit Paaren */
TE.rr = ids => {
  const a = [...ids]; if (a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pr = [];
    for (let i = 0; i < n / 2; i++) { const x = a[i], y = a[n - 1 - i]; if (x && y) pr.push(r % 2 ? [y, x] : [x, y]); }
    rounds.push(pr); a.splice(1, 0, a.pop());
  }
  return rounds;
};

/* Gruppen verteilen: gesetzte Teams (Setzliste) zuerst, Schlangenlinie über die Gruppen */
TE.groupDraw = (teams, G, seeded) => {
  let order;
  if (seeded) {
    const s = teams.filter(t => t.seed > 0).sort((a, b) => a.seed - b.seed), u = TE.shuffle(teams.filter(t => !(t.seed > 0)));
    order = [...s, ...u];
  } else order = TE.shuffle(teams);
  const steps = order.map((t, i) => { const r = Math.floor(i / G), c = i % G; return {t: t.id, g: r % 2 ? G - 1 - c : c}; });
  if (!seeded) steps.forEach((s, i) => { s.g = i % G; });   // ohne Setzliste: reihum
  return steps;
};

TE.buildGroups = (t, groups) => {
  t.groups = groups.map((g, i) => ({name: String.fromCharCode(65 + i), teams: g}));
  const per = t.groups.map(g => { let rs = TE.rr(g.teams); if (t.cfg.rr === 2) rs = rs.concat(rs.map(r => r.map(([x, y]) => [y, x]))); return rs; });
  const maxR = Math.max(0, ...per.map(r => r.length)), M = [];
  for (let r = 0; r < maxR; r++) t.groups.forEach((g, gi) => (per[gi][r] || []).forEach(([x, y], j) => M.push({id: `g${g.name}${r + 1}_${j}`, stage: 'g', group: g.name, round: r + 1, a: x, b: y})));
  t.lots = Object.fromEntries(t.teams.map(x => [x.id, Math.random()]));
  return M;
};

/* K.-o.-Baum (einfach oder Double Elimination) mit Freilosen */
TE.buildKO = (cfg, entrants) => {
  const n = entrants.length, P = 2 ** Math.ceil(Math.log2(Math.max(2, n))), k = Math.log2(P);
  const ord = TE.seedOrder(P), id = (s, r, i) => `${s}${r}_${i}`;
  const slot = i => ord[i] <= n ? {t: entrants[ord[i] - 1]} : {bye: 1};
  const M = [];
  for (let r = 1; r <= k; r++) for (let i = 0; i < P / 2 ** r; i++)
    M.push({id: id('w', r, i), stage: 'w', round: r, i, sa: r === 1 ? slot(2 * i) : {w: id('w', r - 1, 2 * i)}, sb: r === 1 ? slot(2 * i + 1) : {w: id('w', r - 1, 2 * i + 1)}});
  if (cfg.ko === 'double' && k >= 2) {
    let lr = 1, prev = [];
    for (let i = 0; i < P / 4; i++) { const mid = id('l', 1, i); M.push({id: mid, stage: 'l', round: 1, i, sa: {l: id('w', 1, 2 * i)}, sb: {l: id('w', 1, 2 * i + 1)}}); prev.push(mid); }
    for (let w = 2; w <= k; w++) {
      lr++; const wl = []; for (let i = 0; i < P / 2 ** w; i++) wl.push(id('w', w, i)); wl.reverse();
      const drop = prev.map((p, i) => { const mid = id('l', lr, i); M.push({id: mid, stage: 'l', round: lr, i, sa: {w: p}, sb: {l: wl[i]}}); return mid; });
      prev = drop;
      if (w < k) { lr++; const cons = []; for (let i = 0; i < prev.length / 2; i++) { const mid = id('l', lr, i); M.push({id: mid, stage: 'l', round: lr, i, sa: {w: prev[2 * i]}, sb: {w: prev[2 * i + 1]}}); cons.push(mid); } prev = cons; }
    }
    M.push({id: 'gf', stage: 'gf', round: 1, i: 0, sa: {w: id('w', k, 0)}, sb: {w: prev[0]}});
    if (cfg.reset) M.push({id: 'gf2', stage: 'gf', round: 2, i: 0, reset: 'gf'});
  } else if (cfg.third && k >= 2) {
    M.push({id: 'p3', stage: 'p3', round: 1, i: 0, sa: {l: id('w', k - 1, 0)}, sb: {l: id('w', k - 1, 1)}});
  }
  return M;
};

/* Alle Paarungen auflösen: wer spielt, wer hat gewonnen (Freilose laufen automatisch durch) */
TE.resolve = t => {
  const byId = Object.fromEntries((t.matches || []).map(m => [m.id, m])), memo = {}, busy = new Set();
  const out = mid => {
    if (memo[mid]) return memo[mid];
    const m = byId[mid]; if (!m || busy.has(mid)) return {a: null, b: null, w: null, l: null};
    busy.add(mid);
    const side = src => { if (!src) return null; if (src.t) return src.t; if (src.bye) return 'BYE'; const r = out(src.w || src.l); return src.w ? r.w : r.l; };
    let r;
    if (m.reset) {
      const g = out(m.reset);
      if (!g.w) r = {a: null, b: null, w: null, l: null};
      else if (g.w === g.a) r = {a: null, b: null, w: g.w, l: g.l, skip: true};
      else { const a = g.a, b = g.b; r = {a, b, w: null, l: null}; if (m.res && (m.res.w === a || m.res.w === b)) { r.w = m.res.w; r.l = r.w === a ? b : a; } }
    } else {
      const a = m.a ?? side(m.sa), b = m.b ?? side(m.sb);
      r = {a, b, w: null, l: null};
      if (a && b) {
        if (a === 'BYE' && b === 'BYE') { r.w = 'BYE'; r.l = 'BYE'; r.auto = true; }
        else if (a === 'BYE') { r.w = b; r.l = 'BYE'; r.auto = true; }
        else if (b === 'BYE') { r.w = a; r.l = 'BYE'; r.auto = true; }
        else if (m.res && (m.res.w === a || m.res.w === b)) { r.w = m.res.w; r.l = r.w === a ? b : a; }
      }
    }
    busy.delete(mid);
    return memo[mid] = r;
  };
  for (const m of t.matches || []) out(m.id);
  return memo;
};
TE.playable = (t, R = TE.resolve(t)) => (t.matches || []).filter(m => { const r = R[m.id]; return r && r.a && r.b && r.a !== 'BYE' && r.b !== 'BYE' && !r.w && !r.skip; });
TE.champion = t => {
  const R = TE.resolve(t), ko = (t.matches || []).filter(m => m.stage !== 'g');
  if (!ko.length) return null;
  if (R.gf2 && (R.gf2.w)) return R.gf2.w;
  if (R.gf) return R.gf2 ? null : R.gf.w;
  const fin = ko.filter(m => m.stage === 'w').sort((a, b) => b.round - a.round)[0];
  return fin ? R[fin.id].w : null;
};

/* Gruppentabelle mit wählbarer Gleichstandsregel */
TE.table = (t, gname) => {
  const g = t.groups.find(x => x.name === gname); if (!g) return [];
  const rows = Object.fromEntries(g.teams.map(id => [id, {id, p: 0, w: 0, l: 0, pf: 0, pa: 0}]));
  const ms = t.matches.filter(m => m.stage === 'g' && m.group === gname && m.res && rows[m.a] && rows[m.b]);
  for (const m of ms) {
    const A = rows[m.a], B = rows[m.b]; A.p++; B.p++;
    if (m.res.w === m.a) { A.w++; B.l++; } else { B.w++; A.l++; }
    if (typeof m.res.sa === 'number' && typeof m.res.sb === 'number') { A.pf += m.res.sa; A.pa += m.res.sb; B.pf += m.res.sb; B.pa += m.res.sa; }
  }
  const crits = (t.cfg.tiebreak || ['h2h', 'diff', 'pts']);
  const val = (c, set, r) => {
    if (c === 'diff') return r.pf - r.pa;
    if (c === 'pts') return r.pf;
    if (c === 'h2h') return ms.filter(m => set.includes(m.a) && set.includes(m.b) && m.res.w === r.id).length;
    return 0;
  };
  const rank = (list, ci) => {
    if (list.length < 2) return list;
    if (ci >= crits.length) return [...list].sort((a, b) => (t.lots[a.id] || 0) - (t.lots[b.id] || 0)).map(r => ({...r, lot: true}));
    const set = list.map(r => r.id), c = crits[ci];
    const grp = {}; for (const r of list) (grp[val(c, set, r)] ||= []).push(r);
    return Object.keys(grp).map(Number).sort((a, b) => b - a).flatMap(v => rank(grp[v], ci + 1));
  };
  const byW = {}; for (const r of Object.values(rows)) (byW[r.w] ||= []).push(r);
  const out = Object.keys(byW).map(Number).sort((a, b) => b - a).flatMap(w => rank(byW[w], 0));
  return out.map((r, i) => ({...r, pos: i + 1}));
};
TE.groupsDone = t => t.matches.filter(m => m.stage === 'g').every(m => m.res);
/* Wer kommt weiter: Top X je Gruppe + beste Nächstplatzierte, sortiert für die Setzliste */
TE.nextPow = n => 2 ** Math.ceil(Math.log2(Math.max(2, n)));
/* Wie viele kommen weiter: direkt (Top X je Gruppe) + ggf. Nächstplatzierte bis zur nächsten K.-o.-Größe */
TE.advInfo = (cfg, sizes) => {
  const adv = cfg.adv || 2, direct = sizes.reduce((a, g) => a + Math.min(adv, g), 0), total = sizes.reduce((a, g) => a + g, 0);
  if (cfg.byes) { const K = TE.nextPow(direct); return {direct, extra: 0, K, byes: K - direct}; }
  const K = TE.nextPow(direct), extra = Math.min(K - direct, total - direct), n = direct + extra;
  return {direct, extra, K: TE.nextPow(n), byes: TE.nextPow(n) - n};
};
TE.groupSizes = (n, size) => { const G = Math.max(1, Math.ceil(n / size)), base = Math.floor(n / G), r = n % G; return Array.from({length: G}, (_, i) => base + (i < r ? 1 : 0)); };
TE.qualifiers = t => {
  const adv = t.cfg.adv || 2, tabs = t.groups.map(g => TE.table(t, g.name));
  const extra = t.cfg.extra != null && t.cfg.byes == null ? t.cfg.extra : TE.advInfo(t.cfg, t.groups.map(g => g.teams.length)).extra;
  const q = [], rest = [];
  tabs.forEach(tb => tb.forEach(r => (r.pos <= adv ? q : rest).push(r)));
  const sorter = (a, b) => a.pos - b.pos || b.w - a.w || (b.pf - b.pa) - (a.pf - a.pa) || b.pf - a.pf;
  rest.sort(sorter);
  return [...q, ...rest.slice(0, extra)].sort(sorter).map(r => r.id);
};

/* Platzierungen (für Archiv, Profil, Elo) */
TE.places = t => {
  const R = TE.resolve(t), P = {}, ko = t.matches.filter(m => m.stage !== 'g');
  const inKO = new Set();
  ko.forEach(m => { const r = R[m.id]; [r.a, r.b].forEach(x => { if (x && x !== 'BYE') inKO.add(x); }); });
  if (ko.length) {
    let alive = inKO.size;
    const champ = TE.champion(t);
    const stages = ko.some(m => m.stage === 'gf') ? ['l', 'gf'] : ['w'];
    const groups = {};
    for (const m of ko) if (stages.includes(m.stage)) (groups[m.stage + '|' + String(m.round).padStart(2, '0')] ||= []).push(m);
    const st = k => stages.indexOf(k.split('|')[0]);
    const keys = Object.keys(groups).sort((a, b) => st(a) - st(b) || a.localeCompare(b));
    const p3 = R.p3;
    for (const k of keys) {
      const ls = []; let skipped = 0;
      for (const m of groups[k]) {
        const r = R[m.id]; if (!r.w || r.skip || !r.l || r.l === 'BYE') continue;
        if (m.stage === 'gf' && m.id === 'gf' && R.gf2 && !R.gf2.skip) continue;  // erstes Finale zählt nicht, wenn zurückgesetzt
        if (p3 && p3.w && m.stage === 'w' && m.round === Math.max(...ko.filter(x => x.stage === 'w').map(x => x.round)) - 1) { skipped++; continue; }
        ls.push(r.l);
      }
      alive -= skipped;
      const place = alive - ls.length + 1; ls.forEach(x => { P[x] = place; }); alive -= ls.length;
    }
    if (p3 && p3.w && p3.l) { if (p3.w !== 'BYE') P[p3.w] = 3; if (p3.l !== 'BYE') P[p3.l] = 4; }
    if (champ && champ !== 'BYE') P[champ] = 1;
  }
  // in der Gruppenphase ausgeschieden: nach Gruppenplatz, dann Siegen
  if (t.groups && t.groups.length) {
    const outT = []; t.groups.forEach(g => TE.table(t, g.name).forEach(r => { if (!(r.id in P) && !inKO.has(r.id)) outT.push(r); }));
    outT.sort((a, b) => a.pos - b.pos || b.w - a.w || (b.pf - b.pa) - (a.pf - a.pa));
    let base = Object.keys(P).length, pos = base, last = null, i = 0;
    for (const r of outT) { i++; const key = r.pos + '|' + r.w + '|' + (r.pf - r.pa); if (key !== last) pos = base + i; P[r.id] = pos; last = key; }
  }
  return P;
};

/* Platz-Bezeichnungen, auch live: 1./2., 3./4. (mit Spiel um Platz 3) bzw. HF, dann VF, AF, Gruppe.
   Ergebnis: {teamId: [Bezeichnung, Rang zum Sortieren]} – nur für Teams, deren Platz schon feststeht. */
TE.labels = t => {
  const R = TE.resolve(t), L = {}, ko = (t.matches || []).filter(m => m.stage !== 'g'), done = t.status === 'done', P = done ? TE.places(t) : {};
  const set = (id, lab, rk) => { if (id && id !== 'BYE' && !(id in L)) L[id] = [lab, P[id] || rk]; };
  const champ = TE.champion(t), dbl = ko.some(m => m.stage === 'l' || m.stage === 'gf');
  if (ko.length) {
    if (champ && champ !== 'BYE') set(champ, '1.', 1);
    if (R.p3 && R.p3.w && R.p3.l) { set(R.p3.w, '3.', 3); set(R.p3.l, '4.', 4); }
    if (dbl) {
      const fin = R.gf2 && !R.gf2.skip ? R.gf2 : R.gf; if (fin && fin.w && fin.l) set(fin.l, '2.', 2);
      /* Verliererbaum: Bezeichnung nach der Platz-Spanne, die beim Ausscheiden feststeht (3., 4., 5–8 = VF, 9–16 = AF …) */
      const PL = done ? P : TE.places(t), band = p => p <= 4 ? p + '.' : p <= 8 ? 'VF' : p <= 16 ? 'AF' : p <= 32 ? '1/16' : 'Runde';
      for (const m of ko.filter(x => x.stage === 'l')) { const r = R[m.id]; if (r && r.w && r.l && !r.skip && PL[r.l]) set(r.l, band(PL[r.l]), PL[r.l]); }
    } else {
      const max = Math.max(...ko.filter(x => x.stage === 'w').map(x => x.round));
      for (const m of ko.filter(x => x.stage === 'w')) { const r = R[m.id]; if (!r || !r.w || !r.l || r.skip || r.auto) continue;
        const left = max - m.round; set(r.l, left === 0 ? '2.' : left === 1 ? 'HF' : left === 2 ? 'VF' : left === 3 ? 'AF' : 'Runde ' + m.round, 2 ** left + 1); }
    }
    if (t.groups && t.groups.length) { const inKO = new Set(); ko.forEach(m => { const r = R[m.id]; if (r) [r.a, r.b].forEach(x => x && inKO.add(x)); });
      if (inKO.size) for (const g of t.groups) for (const id of g.teams) if (!inKO.has(id)) set(id, 'Gruppe', inKO.size + 1); }
  } else if (done) for (const [id, p] of Object.entries(P)) set(id, p + '.', p);
  return L;
};

/* Spiele eines Turniers für die Statistik (nur echte Ergebnisse, keine Freilose) */
TE.games = t => { const R = TE.resolve(t); return t.matches.filter(m => { const r = R[m.id]; return r && r.w && !r.auto && !r.skip && r.a !== 'BYE' && r.b !== 'BYE' && m.res; }).map(m => [R[m.id].a, R[m.id].b, R[m.id].w]); };

/* Elo pro Spieler (nur Flunkyball): Turniere + Spiele aus dem Spielmodus */
TE.EW = {real: 1, test: 1, game: 1};
TE.elo = (summaries, games, W = TE.EW) => {
  const wt = k => { const v = Number((W || {})[k]); return isFinite(v) && v >= 0 ? v : 1; };
  const ev = [];
  for (const s of summaries) if (s.sport === 'flunkyball' && s.games) {
    const tp = Object.fromEntries((s.teams || []).map(x => [x.id, (x.players || []).filter(p => !String(p).startsWith('g:'))]));
    const k = wt(s.type === 'real' ? 'real' : 'test');
    s.games.forEach(([a, b, w], i) => ev.push({d: s.d, o: i, a: tp[a] || [], b: tp[b] || [], aw: w === a, src: s.name, k}));
  }
  for (const g of games || []) if (g.a && g.b && (g.w === 'a' || g.w === 'b') && !g.tm) ev.push({d: g.d, o: 0, a: g.a.players, b: g.b.players, aw: g.w === 'a', src: 'Spiel', k: wt('game')});
  ev.sort((x, y) => (x.d || '').localeCompare(y.d || '') || x.o - y.o);
  const R = {}, get = p => (R[p] ||= {r: 1000, n: 0, w: 0, l: 0, hist: []});
  for (const e of ev) {
    if (!e.a.length || !e.b.length || !e.k) continue;
    const ra = e.a.reduce((s, p) => s + get(p).r, 0) / e.a.length, rb = e.b.reduce((s, p) => s + get(p).r, 0) / e.b.length;
    const ea = 1 / (1 + 10 ** ((rb - ra) / 400)), d = 32 * e.k * ((e.aw ? 1 : 0) - ea);
    for (const p of e.a) { const x = get(p); x.r += d; x.n++; e.aw ? x.w++ : x.l++; x.hist.push({d: e.d, r: x.r}); }
    for (const p of e.b) { const x = get(p); x.r -= d; x.n++; e.aw ? x.l++ : x.w++; x.hist.push({d: e.d, r: x.r}); }
  }
  return R;
};

TE.summary = t => ({id: t.id, name: t.name, d: t.d, sport: t.sport, type: t.type, status: t.status,
  teams: t.teams.map(x => ({id: x.id, name: x.name, players: x.players})), places: t.status === 'done' ? TE.places(t) : undefined,
  games: t.status !== 'setup' ? TE.games(t) : undefined, labels: t.status !== 'setup' ? TE.labels(t) : undefined, lv: 2, champ: t.status === 'done' ? TE.champion(t) : undefined});

if (typeof module !== 'undefined') module.exports = TE;
if (typeof window === 'undefined') { /* Node-Tests */ } else {

/* ===================== OBERFLÄCHE ===================== */

const tName = (t, id) => id === 'BYE' ? 'Freilos' : ((t.teams.find(x => x.id === id) || {}).name || '?');
const tpn = p => String(p).startsWith('g:') ? p.slice(2) + ' (Gast)' : nameOf(p);
const tPlayers = (t, id) => ((t.teams.find(x => x.id === id) || {}).players || []).map(tpn).join(', ');

const canRes = () => can('tour') || can('direct') || can('tres');

/* Speichern eines Turniers (mit Rückgängig-Schnappschuss, Verlauf und Index-Zusammenfassung) */
async function tSave(msg, fn, {snap = true, log, ok} = {}) {
  const id = TT.cur.id, path = TPATH(id);
  await save('Turnier: ' + msg, async ctx => {

    const idx = ctx.x[TIDX] || emptyIdx();

    (t.log ||= []).push({at: new Date().toISOString(), by: S.me.name, x: log || msg}); if (t.log.length > 400) t.log.shift();
    const i = idx.list.findIndex(x => x.id === id), sm = TE.summary(t);

async function tAct(k) {

  if (k === 'drawgroups') return tDrawGroupsSheet();
  if (k === 'drawko') return tQualifierSheet();
  if (k === 'fields') return guarded(() => tSave('Felder belegt', tt => tAutoFields(tt), {snap: false, ok: 'Felder belegt ✓'}));
  if (k === 'finish') { if (!confirm('Turnier abschließen und archivieren?')) return; return guarded(() => tSave('abgeschlossen', tt => { tt.status = 'done'; tt.matches.forEach(m => delete m.f); }, {ok: 'Archiviert ✓'})); }

    const last = JSON.parse(t.hist[t.hist.length - 1]);

    return guarded(() => tSave('rückgängig: ' + last.msg, tt => { const h = JSON.parse(tt.hist.pop()); Object.assign(tt, {status: h.status, groups: h.groups, matches: h.matches, teams: h.teams, lots: h.lots}); }, {snap: false, ok: 'Rückgängig gemacht ✓'}));
  }
  if (k === 'cfg') return tSettingsSheet();
  if (k === 'tpl') return tTemplateSave();
  if (k === 'delete') {
    const nG = (S.pub.games || []).filter(g => (g.tm && g.tm.tid === t.id) || g.t === t.id).length;
    const nT = Object.values(S.pub.throws || {}).reduce((a, l) => a + (Array.isArray(l) ? l.filter(c => c.t === t.id && !c.g).length : 0), 0);
    if (!confirm(`Turnier „${t.name}“ endgültig löschen?\n\nDabei wird alles mitgelöscht: Ergebnisse, Elo-Wertung und Platzierungen${nG ? `, ${nG} live erfasste Spiele samt Würfen, Strafbieren und Bieren` : ''}${nT ? `, ${nT} weitere Wurf-Einträge zu diesem Turnier` : ''}.`)) return;
    return guarded(async () => {
      let gone = {g: 0, w: 0};
      await save('Turnier gelöscht: ' + t.name, ctx => {
        const idx = ctx.x[TIDX] || emptyIdx(); idx.list = idx.list.filter(x => x.id !== t.id); ctx.x[TIDX] = idx; ctx.xw.add(TIDX);
        ctx.pub.tournaments = (ctx.pub.tournaments || []).filter(x => x.id !== t.id);
        const dead = (ctx.pub.games || []).filter(g => (g.tm && g.tm.tid === t.id) || g.t === t.id);
        for (const g of dead) { const r = removeGameThrows(ctx.pub, g); gone.w += r.removed; }
        gone.g = dead.length; ctx.pub.games = (ctx.pub.games || []).filter(g => !dead.includes(g));
        for (const [pid, l] of Object.entries(ctx.pub.throws || {})) if (Array.isArray(l) && l.some(c => c.t === t.id)) { gone.w += l.filter(c => c.t === t.id).reduce((a, c) => a + c.s.length, 0); ctx.pub.throws[pid] = l.filter(c => c.t !== t.id); }
        (ctx.tvDel ||= []).push(TPATH(t.id)); if (t.tv) ctx.tvDel.push(TVPATH(t.id));
        ctx.after = async () => { TT.index = idx; TT.cur = null; };
      }, {files: [TIDX], quiet: true});
      toast('Turnier gelöscht ✓' + (gone.g ? ` inkl. ${gone.g} Spiele` : '') + (gone.w ? ` und ${gone.w} Würfe` : ''));

}

/* ---------- Spielplan / Gruppen / Baum ---------- */
const stageName = (t, m) => m.stage === 'g' ? 'Gruppe ' + m.group : m.stage === 'p3' ? 'Spiel um Platz 3' : m.stage === 'gf' ? (m.round === 2 ? 'Finale (Rückspiel)' : 'Finale') : m.stage === 'l' ? 'Verliererrunde ' + m.round : koRoundName(t, m);

  const max = Math.max(...t.matches.filter(x => x.stage === 'w').map(x => x.round)), left = max - m.round;
  if (t.cfg.ko === 'double') return left === 0 ? 'Gewinner-Finale' : left === 1 ? 'Gewinner-Halbfinale' : 'Gewinnerrunde ' + m.round;
  return left === 0 ? 'Finale' : left === 1 ? 'Halbfinale' : left === 2 ? 'Viertelfinale' : left === 3 ? 'Achtelfinale' : 'Runde ' + m.round;
}
function tMatchHtml(t, m, R, big) {

  const res = m.res, sc = res && typeof res.sa === 'number' ? `${res.sa}:${res.sb}` : '';
  const nm = x => x ? (x === 'BYE' ? '<i>Freilos</i>' : esc(tName(t, x))) : '<i style="color:var(--muted)">offen</i>';
  const pend = (TT.pendMine || {})[t.id + '|' + m.id];
  return `<button class="mcard ${r.w ? 'done' : ''} ${m.f ? 'onfield' : ''}" data-mid="${m.id}">
    <div class="mh">${m.f ? '<b>Feld ' + m.f + '</b> · ' : ''}${esc(stageName(t, m))}${r.auto ? ' · Freilos' : ''}${r.skip ? ' · nicht nötig' : ''}${pend ? ' · ⏳ eingereicht' : ''}</div>
    <div class="mt ${r.w && r.w === r.a ? 'win' : ''}">${nm(r.a)}<span>${res && typeof res.sa === 'number' ? res.sa : r.w === r.a && r.w ? '✓' : ''}</span></div>
    <div class="mt ${r.w && r.w === r.b ? 'win' : ''}">${nm(r.b)}<span>${res && typeof res.sb === 'number' ? res.sb : r.w === r.b && r.w ? '✓' : ''}</span></div></button>`;
}
function tPlanHtml(t, R) {
  if (t.status === 'setup') return `<div class="empty">${t.teams.length} Teams eingetragen. ${canT() ? 'Wenn alle drin sind: oben „Auslosen“.' : 'Die Auslosung kommt gleich.'}</div>`;
  const pl = TE.playable(t, R).sort(tPrio);
  const onF = pl.filter(m => m.f).sort((a, b) => a.f - b.f), next = pl.filter(m => !m.f);
  const done = t.matches.filter(m => R[m.id] && R[m.id].w && m.res).sort((a, b) => (b.res.at || '').localeCompare(a.res.at || ''));
  return `${onF.length ? '<h3 class="sect">Auf den Feldern</h3>' + onF.map(m => tMatchHtml(t, m, R)).join('') : ''}
    <h3 class="sect">Als Nächstes</h3>${next.map(m => tMatchHtml(t, m, R)).join('') || '<div class="empty">Keine offenen Spiele</div>'}
    <h3 class="sect">Gespielt</h3>${done.map(m => tMatchHtml(t, m, R)).join('') || '<div class="empty">Noch keine Ergebnisse</div>'}`;
}
/* Reihenfolge: Gruppenspiele rundenweise und innerhalb der Runde abwechselnd zwischen den Gruppen (A1, B1, C1, A2, B2 …) */
const tSlot = m => m.stage === 'g' ? +(String(m.id).split('_')[1] || 0) : 0;
const tPrio = (a, b) => ({g: 0, w: 1, l: 1, p3: 2, gf: 3}[a.stage] - {g: 0, w: 1, l: 1, p3: 2, gf: 3}[b.stage]) || a.round - b.round || tSlot(a) - tSlot(b) || (a.stage === 'w' ? -1 : 1) * (a.stage !== b.stage) || String(a.group || '').localeCompare(String(b.group || '')) || a.id.localeCompare(b.id);
function tAutoFields(t) {
  const F = t.cfg.fields || 1, R = TE.resolve(t), pl = TE.playable(t, R).sort(tPrio);
  t.matches.forEach(m => { if (m.f && !pl.includes(m)) delete m.f; });
  const used = new Set(pl.filter(m => m.f).map(m => m.f));
  for (const m of pl) { if (m.f) continue; let f = 1; while (used.has(f) && f <= F) f++; if (f > F) break; m.f = f; used.add(f); }
}
function tGroupHtml(t, g, R) {
  const tb = TE.table(t, g.name), adv = t.cfg.adv || 2, sc = t.cfg.score === 'score';
  return `<div class="card"><b>Gruppe ${g.name}</b>
    <div class="gt"><div class="gth"><span>#</span><span class="n">Team</span><span>Sp</span><span>S</span><span>N</span>${sc ? '<span>Diff</span>' : ''}</div>

}

function tCfgWire(c, redraw) {
  const keep = () => Object.assign(c, tReadCfg(c));
  const w = (id, f) => { const el = $('#' + id); if (el) el.onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; keep(); f(b.dataset.v); redraw(); }; };
  w('cG', v => { c.groups = v === '1'; if (!c.groups && c.ko === 'none') c.ko = 'single'; });
  w('cRR', v => { c.rr = +v; });
  w('cTB', v => { c.tiebreak = v === 'h2h' ? ['h2h', 'diff', 'pts'] : ['diff', 'h2h', 'pts']; });
  w('cKO', v => { c.ko = v; });

  const upd = () => { const el = $('#advInfo'); if (!el) return; const n = parseInt(($('#cN') || {}).value, 10) || 0; TT.prevN = n || null; el.innerHTML = tAdvTxt(tReadCfg(c), n); };
  ['cSize', 'cAdv', 'cN'].forEach(id => { const el = $('#' + id); if (el) el.oninput = upd; });
}
function tReadCfg(c) {
  const n = (id, d, min, max) => { const el = $('#' + id); if (!el) return d; const v = parseInt(el.value, 10); return isFinite(v) ? Math.min(max, Math.max(min, v)) : d; };
  const ck = (id, d) => { const el = $('#' + id); return el ? el.checked : d; };
  return {...c, size: n('cSize', c.size, 2, 16), adv: n('cAdv', c.adv, 1, 8), fields: n('cF', c.fields, 1, 20),
    reset: ck('cReset', c.reset), third: ck('cThird', c.third), seeding: ck('cSeed', c.seeding)};
}

/* ---------- Teams ---------- */

/* Teams aus früheren Turnieren und Spielen zum Übernehmen */
function tOldTeams() {
  const seen = new Set(), out = [];
  const add = (name, players) => { const k = name.toLowerCase() + '|' + [...players].sort().join(','); if (!seen.has(k) && players.length) { seen.add(k); out.push({name, players}); } };
  [...(TT.index ? TT.index.list : [])].sort((a, b) => (b.d || '').localeCompare(a.d || '')).forEach(s => (s.teams || []).forEach(x => add(x.name, (x.players || []).filter(p => S.pub.people[p]))));
  [...(S.pub.games || [])].reverse().forEach(g => { if (g.a && g.b) { add(g.a.name, g.a.players); add(g.b.name, g.b.players); } });
  return out.slice(0, 60);
}

/* ---------- Auslosung (langsam/schnell + manuell tauschen) ---------- */
function tDrawGroupsSheet() {
  const t = TT.cur, n = t.teams.length, G = Math.max(1, Math.ceil(n / t.cfg.size));
  let steps = TE.groupDraw(t.teams, G, t.cfg.seeding), shown = 0, timer = null, sel = null;
  const groups = () => { const g = Array.from({length: G}, () => []); steps.slice(0, shown).forEach(s => g[s.g].push(s.t)); return g; };
  const draw = () => {
    const g = groups(), rest = steps.slice(shown);
    openSheet(`<h2>🎲 Gruppen auslosen</h2><p class="sub">${n} Teams → ${G} Gruppen${t.cfg.seeding ? ' · Setzliste aktiv' : ''}. Nach der Auslosung kannst du zwei Teams antippen, um sie zu tauschen.</p>
      ${rest.length ? `<div class="pot">${rest.map(s => `<span>${esc(tName(t, s.t))}</span>`).join('')}</div>` : ''}
      <div class="dgrid">${g.map((x, i) => `<div class="dg"><b>Gruppe ${String.fromCharCode(65 + i)}</b>${x.map(id => `<button class="dteam ${sel === id ? 'sel' : ''} ${id === (steps[shown - 1] || {}).t && timer ? 'new' : ''}" data-id="${id}">${esc(tName(t, id))}</button>`).join('')}</div>`).join('')}</div>
      ${shown < steps.length ? `<div class="two"><button class="btn" id="dSlow">🐢 Langsam (Los für Los)</button><button class="btn pri" id="dFast">⚡ Schnell</button></div>`
        : `<div class="two"><button class="btn" id="dAgain">🔄 Neu losen</button><button class="btn pri" id="dOk">✅ Übernehmen</button></div>`}`, () => { clearInterval(timer); return true; });
    if ($('#dSlow')) $('#dSlow').onclick = () => { clearInterval(timer); timer = setInterval(() => { shown++; if (shown >= steps.length) { clearInterval(timer); timer = null; } draw(); }, 1100); $('#dSlow').disabled = true; };
    if ($('#dFast')) $('#dFast').onclick = () => { clearInterval(timer); timer = null; shown = steps.length; draw(); };
    if ($('#dAgain')) $('#dAgain').onclick = () => { steps = TE.groupDraw(t.teams, G, t.cfg.seeding); shown = 0; sel = null; draw(); };
    $('#sheetBody').querySelectorAll('.dteam').forEach(b => b.onclick = () => {
      if (shown < steps.length) return;
      const id = b.dataset.id; if (!sel) { sel = id; return draw(); }
      if (sel !== id) { const a = steps.find(s => s.t === sel), c = steps.find(s => s.t === id); [a.g, c.g] = [c.g, a.g]; }
      sel = null; draw();
    });
    if ($('#dOk')) $('#dOk').onclick = () => guarded(async () => {
      const gr = groups().filter(x => x.length);
      if (gr.some(x => x.length < 2)) throw new Error('Jede Gruppe braucht mindestens 2 Teams.');
      await tSave('Gruppen ausgelost', tt => {
        if (tt.status !== 'setup') throw new Error('Es wurde inzwischen schon ausgelost.');
        if (tt.teams.length !== n) throw new Error('Die Teams haben sich geändert – bitte neu losen.');
        tt.matches = TE.buildGroups(tt, gr); tt.status = 'groups'; tAutoFields(tt);
      }, {ok: 'Gruppen stehen ✓'});
      closeSheet(true); TT.sub = 'groups'; renderTour();
    });
  };
  draw();
}

    openSheet(`<h2>K.-o.-Phase</h2><p class="sub">${t.status === 'groups' ? 'Diese Teams kommen laut Tabelle weiter. Du kannst Teams an- oder abwählen.' : 'Teilnehmer der K.-o.-Phase.'}</p>
      <div class="list">${t.teams.map(x => `<label class="row" style="cursor:pointer"><input type="checkbox" data-q="${x.id}" ${q.includes(x.id) ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--gold)"><span class="nm">${esc(x.name)}<small>${q.includes(x.id) ? 'dabei · Reihenfolge ' + (q.indexOf(x.id) + 1) : 'nicht dabei'}</small></span></label>`).join('')}</div>
      <p class="hint">${q.length} Teams${q.length & (q.length - 1) ? ' – ' + ((2 ** Math.ceil(Math.log2(q.length))) - q.length) + ' Freilos(e) für die Bestplatzierten' : ''}${t.status === 'groups' ? '<br>Modus: ' + (t.cfg.byes ? 'mit Freilosen' : 'ohne Freilose (Nächstplatzierte füllen auf)') : ''}</p>

function tDrawKOSheet(entrants) {
  const t = TT.cur, n = entrants.length, P = 2 ** Math.ceil(Math.log2(n)), ord = TE.seedOrder(P);
  let mode = t.cfg.seeding || t.status === 'groups' ? 'seed' : 'random', order = mode === 'seed' ? [...entrants] : TE.shuffle(entrants), shown = 0, timer = null, sel = null;
  const slots = () => ord.map(s => s <= n ? (s - 1 < shown ? order[s - 1] : '?') : 'BYE');
  const draw = () => {
    const sl = slots(), pairs = []; for (let i = 0; i < P; i += 2) pairs.push([sl[i], sl[i + 1]]);
    const nm = x => x === 'BYE' ? '<i>Freilos</i>' : x === '?' ? '<i style="color:var(--muted)">…</i>' : esc(tName(t, x));
    openSheet(`<h2>🎲 K.-o.-Auslosung</h2><p class="sub">Modus: <b>${mode === 'seed' ? 'nach Setzliste/Tabelle (Beste treffen sich spät)' : 'freies Los'}</b>. Zwei Teams antippen = tauschen.</p>
      <div class="seg" id="kMode" style="margin-bottom:8px"><button data-v="seed" class="${mode === 'seed' ? 'on' : ''}">Nach Setzliste</button><button data-v="random" class="${mode === 'random' ? 'on' : ''}">Freies Los</button></div>
      <div class="list">${pairs.map(([a, b], i) => `<div class="row" style="gap:6px"><span class="pl">${i + 1}</span><button class="dteam ${sel === a ? 'sel' : ''}" data-id="${a}">${nm(a)}</button><span style="color:var(--muted)">vs</span><button class="dteam ${sel === b ? 'sel' : ''}" data-id="${b}">${nm(b)}</button></div>`).join('')}</div>
      ${shown < n ? `<div class="two"><button class="btn" id="dSlow">🐢 Langsam</button><button class="btn pri" id="dFast">⚡ Schnell</button></div>`
        : `<div class="two"><button class="btn" id="dAgain">🔄 Neu losen</button><button class="btn pri" id="dOk">✅ Übernehmen</button></div>`}<div class="err" id="err"></div>`, () => { clearInterval(timer); return true; });
    $('#kMode').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; mode = b.dataset.v; order = mode === 'seed' ? [...entrants] : TE.shuffle(entrants); shown = 0; sel = null; clearInterval(timer); draw(); };
    if ($('#dSlow')) $('#dSlow').onclick = () => { clearInterval(timer); timer = setInterval(() => { shown++; if (shown >= n) { clearInterval(timer); timer = null; } draw(); }, 1100); $('#dSlow').disabled = true; };
    if ($('#dFast')) $('#dFast').onclick = () => { clearInterval(timer); shown = n; draw(); };
    if ($('#dAgain')) $('#dAgain').onclick = () => { order = mode === 'seed' ? [...entrants] : TE.shuffle(entrants); shown = 0; draw(); };
    $('#sheetBody').querySelectorAll('.dteam').forEach(b => b.onclick = () => {
      const id = b.dataset.id; if (shown < n || id === 'BYE' || id === '?') return;
      if (!sel) { sel = id; return draw(); }
      if (sel !== id) { const i = order.indexOf(sel), j = order.indexOf(id); [order[i], order[j]] = [order[j], order[i]]; }
      sel = null; draw();
    });
    if ($('#dOk')) $('#dOk').onclick = () => guarded(async () => {
      await tSave('K.-o.-Phase ausgelost', tt => {
        if (tt.matches.some(m => m.stage !== 'g')) throw new Error('Die K.-o.-Phase wurde inzwischen schon ausgelost.');
        tt.matches = tt.matches.filter(m => m.stage === 'g').concat(TE.buildKO(tt.cfg, order)); tt.status = 'ko'; tAutoFields(tt);
      }, {ok: 'K.-o.-Baum steht ✓'});
      closeSheet(true); TT.sub = 'ko'; renderTour();
    }, $('#err'));
  };
  draw();
}

/* ---------- Ergebnis eintragen ---------- */
function tResultSheet(mid) {

  if (!ready) return toast(r.skip ? 'Dieses Spiel ist nicht nötig.' : r.auto ? 'Freilos – geht automatisch weiter.' : 'Die Gegner stehen noch nicht fest.');

/* Ergebnis setzen; abhängige Spiele, deren Gegner sich dadurch ändern, werden zurückgesetzt */
function tSetResult(t, mid, res, by) {
  const before = TE.resolve(t), m = t.matches.find(x => x.id === mid); if (!m) throw new Error('Spiel nicht gefunden.');
  const r = before[mid];
  if (res && res.w !== r.a && res.w !== r.b) throw new Error('Die Paarung hat sich inzwischen geändert.');
  if (res) { m.res = {...res, by, at: new Date().toISOString()}; delete m.f; } else delete m.res;
  const cleared = [];
  for (let loop = 0; loop < 50; loop++) {
    const after = TE.resolve(t); let ch = false;
    for (const x of t.matches) if (x.res && x.id !== mid) { const a = after[x.id]; if (x.res.w !== a.a && x.res.w !== a.b) { delete x.res; cleared.push(x.id); ch = true; } }
    if (!ch) break;
  }
  if (t.status === 'ko' && !TE.champion(t)) {} // offen
  return cleared;
}
async function tApplyResult(mid, res, f) {
  const t = TT.cur, R = TE.resolve(t), r = R[mid];
  const label = `${tName(t, r.a)} vs ${tName(t, r.b)}`;
  await tSave(res ? 'Ergebnis ' + label : 'Ergebnis gelöscht ' + label, tt => {
    const cl = tSetResult(tt, mid, res, S.me.name);
    if (cl.length && !confirm(cl.length + ' spätere Ergebnisse hängen davon ab und werden zurückgesetzt. Fortfahren?')) throw new Error('Abgebrochen.');
    if (f) { const x = tt.matches.find(y => y.id === mid); if (!res) x.f = f; }
    tAutoFields(tt);
  }, {log: res ? `Ergebnis: ${label} → ${tName(t, res.w)}${typeof res.sa === 'number' ? ' (' + res.sa + ':' + res.sb + ')' : ''}` : 'Ergebnis gelöscht: ' + label});
}

const TVPATH = id => 'data/turniere/' + id + '.view.json';

async function tViewFiles(ctx) {
  const out = [];

    const m = pth.match(/^data\/turniere\/(u[0-9a-f]{10})\.json$/); if (!m) continue;
    const t = ctx.x[pth]; if (!t || !t.tv) continue;
    const pids = new Set(t.teams.flatMap(x => x.players || []).filter(p => ctx.pub.people[p]));
    const names = Object.fromEntries([...pids].map(p => [p, ctx.pub.people[p].n || ctx.pub.people[p].s || '?']));
    const {hist, log, tv, ...slim} = t;
    const K = await importK(unb64(t.tv.k));
    out.push({path: TVPATH(t.id), content: JSON.stringify({ffdview: 1, salt: t.tv.salt, iter: t.tv.iter, ...(await aesEnc(K, enc.encode(JSON.stringify({t: slim, names, at: new Date().toISOString()}))))}) + '\n'});
  }
  for (const pth of ctx.tvDel || []) out.push({path: pth, del: true});
  return out;
}

    const a = tm(x.a), b = tm(x.b); return a.players.length && b.players.length && !a.players.some(z => b.players.includes(z)) ? {a, b, w: x.w} : null; };

    for (const [k, v] of Object.entries(o.pen || {})) if (players.includes(k) && Number.isInteger(v) && v > 0 && v < 30) pen[k] = v;
    for (const [k, v] of Object.entries(o.tb || {})) if (players.includes(k) && Array.isArray(v)) { const l = v.filter(n => Number.isInteger(n) && n >= 0 && n < 200).slice(0, 30); if (l.length) tb[k] = l; }

    if (o.teams) { const t = pg({...o.teams, w: 'a'}, gref); if (t) { teams = {a: t.a, b: t.b}; if (o.w === 'a' || o.w === 'b') w = o.w; } }
    const tm = o.tm && /^u[0-9a-f]{10}$/.test(o.tm.tid) && typeof o.tm.mid === 'string' && o.tm.mid.length < 20 ? {tid: o.tm.tid, mid: o.tm.mid, ta: String(o.tm.ta || '').slice(0, 20), tb: String(o.tm.tb || '').slice(0, 20)} : null;
    const ext = !teams && o.ext && typeof o.ext === 'object' ? {name: String(o.ext.name || '').slice(0, 40), ...(o.ext.w === 'w' || o.ext.w === 'l' ? {w: o.ext.w} : {})} : null;

    const beers = {}; for (const [k, v] of Object.entries(o.beers || {})) if (ref(k) && Array.isArray(v)) { const l = v.filter(n => Number.isInteger(n) && n > 0 && n < 100).slice(0, 50); if (l.length) beers[k] = l; }

  }

}

/* Holt den neuesten Stand, lässt mutate() darauf arbeiten und speichert alles als einen Commit. */
async function save(message, mutate, {busyText = 'Speichere …', quiet = false, okText, files: extraFiles = []} = {}) {
  busy(true, busyText);
  try {
    await ensureBranch();
    for (let attempt = 0; attempt < 4; attempt++) {
      const ref = await gh('git/ref/heads/' + S.repo.branch);
      const headSha = ref.object.sha;
      const commit = await gh('git/commits/' + headSha);
      const pub = await openJ(JSON.parse(await gh('contents/data/public.json?ref=' + headSha, {raw: true})));
      const secTxt = await gh('contents/data/secret.json?ref=' + headSha, {raw: true});
      const secFile = secTxt ? JSON.parse(secTxt) : null;
      pub.throws ||= {}; ensureOther(pub);
      const ctx = {pub, secFile, secDirty: false, names: null, namesDirty: false, newSecret: null, x: {}, xw: new Set()};
      for (const pth of extraFiles) { const tx = await gh('contents/' + pth + '?ref=' + headSha, {raw: true}); ctx.x[pth] = tx ? await openJ(JSON.parse(tx)) : null; }
      const nk = secFile && secFile.v === 2 ? (secFile.kn ? S.KN : (isAdmin() ? S.KA : null)) : null;
      if (nk) {
        try { ctx.names = (await decJ(nk, secFile.names)).people; }
        catch { logout(true); throw new Error('Dein Zugang wurde geändert. Bitte neu anmelden.'); }
      }
      if (S.role === 'editor' && secFile && !(secFile.editors || {})[S.me.id]) { logout(true); throw new Error('Dein Zugang wurde entfernt.'); }
      if (S.role === 'editor' && secFile) { const me = secFile.editors[S.me.id]; S.perm = Array.isArray(me.perm) ? me.perm : null; }
      delete pub.pending;
      await mutate(ctx);
      if (ctx.names) recomputeShorts(pub, ctx.names);
      pub.updated = new Date().toISOString();
      let outSecret = ctx.newSecret || secFile;
      if (!ctx.newSecret && ctx.namesDirty) { outSecret = {...secFile, names: await encJ(nk, {people: ctx.names})}; }
      if (!ctx.newSecret && ctx.secDirty) outSecret = {...outSecret};
      const KW = 'reseal' in ctx ? ctx.reseal : S.KS;             // Schlüssel zum Schreiben (Seiten-Passwort)
      if ('reseal' in ctx) for (const pth of Object.keys(ctx.x)) if (ctx.x[pth]) ctx.xw.add(pth);
      const files = [{path: 'data/public.json', content: await sealJ(pub, KW) + '\n'}];
      if (outSecret !== secFile) files.push({path: 'data/secret.json', content: JSON.stringify(outSecret, null, 1) + '\n'});
      for (const pth of ctx.xw) files.push({path: pth, content: await sealJ(ctx.x[pth], KW) + '\n'});
      if (window.TOUR && TOUR.viewFiles) for (const f of await TOUR.viewFiles(ctx)) files.push(f);
      if (ctx.lockFile !== undefined) files.push({path: LOCKP, del: !ctx.lockFile, content: ctx.lockFile ? JSON.stringify(ctx.lockFile, null, 1) + '\n' : ''});
      const tree = await gh('git/trees', {method: 'POST', body: {base_tree: commit.tree.sha, tree: files.map(f => f.del ? {path: f.path, mode: '100644', type: 'blob', sha: null} : {path: f.path, mode: '100644', type: 'blob', content: f.content})}});
      const nc = await gh('git/commits', {method: 'POST', body: {message, tree: tree.sha, parents: [headSha]}});
      const upd = await gh('git/refs/heads/' + S.repo.branch, {method: 'PATCH', body: {sha: nc.sha, force: false}, allow: [409, 422]});
      if (upd && (upd.status === 409 || upd.status === 422)) continue;
      S.pub = pub; S.secret = outSecret;
      if ('reseal' in ctx) { S.KS = ctx.reseal; S.lock = ctx.lockFile || null; try { if (ctx.resealRaw) localStorage.setItem('ffd_site', b64(ctx.resealRaw)); else localStorage.removeItem('ffd_site'); } catch {} }
      if (ctx.names) S.names = ctx.names;
      if (ctx.after) await ctx.after();
      render();
      if (!quiet) toast(okText || 'Gespeichert ✓ Für alle in ca. 1 Minute sichtbar');
      return true;
    }
    throw new Error('Gleichzeitige Änderungen – bitte nochmal versuchen.');
  } finally { busy(false); }
}

    if (t) { S.pub = await openJ(JSON.parse(t)); ensureOther(S.pub); }
    const s = await gh('contents/data/secret.json?ref=' + S.repo.branch, {raw: true});

      else if (S.role === 'editor') { if (!S.secret.editors[S.me.id]) throw new Error('removed'); S.me.name = S.secret.editors[S.me.id].name; S.token = await decS(S.Ki, S.secret.editors[S.me.id].tok); await loadNameKey(); }

}

function bestTimes(cat) {
  const best = {};
  for (const t of S.pub.times) if (t.c === cat && validT(t) && inYear(t.d)) { const k = pkey(t.p); if (!best[k] || t.t < best[k].t) best[k] = t; }

}
function throwStats(pid, withLocal = true, k = S.tk) {
  const ch = yearChunks(pid, k);
  const s = ch.map(c => c.s).join('') + (withLocal && (GAME.kind || 'n') === k ? (S.local[pid] || '') : '');
  const N = S.pub.settings.statSize;
  const dateAt = idx => { let k = 0; for (const c of ch) { k += c.s.length; if (idx < k) return c.d; } return today(); };
  const blocks = [];
  for (let i = 0; i + N <= s.length; i += N) { const b = s.slice(i, i + N); blocks.push({hits: [...b].filter(c => c === '1').length, n: N, d: dateAt(i + N - 1)}); }
  const cur = s.slice(blocks.length * N), hits = [...s].filter(c => c === '1').length;
  const bp = blocks.map(b => b.hits / b.n * 100);
  return {s, total: s.length, hits, pct: s.length ? hits / s.length * 100 : null, blocks, bp, avg: avg(bp),
    best: bp.length ? Math.max(...bp) : null, cur, curHits: [...cur].filter(c => c === '1').length, N};
}

/* Aufbau exakt wie die bisherige Excel-Liste:
   A Nachname | B Name/Prozente | C–Q Runde 1–15 | R Bestwert | S Durchschnitt | (T, U leer)
   V Nachname | W Name | X Zeit (0,33) | Y Prozente | Z Anmerkungen | AA Exzeit 0,25 | AB Exzeit 1L Maß | AC Exzeit 0,5 | (AD leer)
   AE Duo | AF Exzeit 0,33 | AG Anmerkung | AH Duo | AI Zeit (weitere Duo-Kategorie) … | BJ schnellste Zeit (Hilfsspalte für Prozente)
   Zeile 1 leer, Kopf in Zeile 2, Zeile 3 leer, Daten ab Zeile 4.
   opts.tIn(d): welche Würfe zählen · opts.xIn(d): welche Ex-Zeiten zählen (Bestzeit daraus) */
function ffdOverviewSheet(name, opts) {

  const rounds = pid => { const s = sChunks(pid).filter(c => kindOf(c) === 'n' && tIn(c.d)).map(c => c.s).join(''); const r = []; for (let i = 0; i + N <= s.length; i += N) r.push([...s.slice(i, i + N)].filter(x => x === '1').length / N * 100); return r; };
  const single = S.pub.categories.filter(c => !c.duo && !isOther(c)), duoCats = S.pub.categories.filter(c => c.duo);
  const byRe = re => single.find(c => re.test(c.name));
  const c33 = byRe(/0[,.]33/), c25 = byRe(/0[,.]25/), cMa = byRe(/(1\s*l|maß|mass)/i), c05 = byRe(/0[,.]5(?!\d)/);
  const fixed = [c25, cMa, c05], extraCats = single.filter(c => c !== c33 && !fixed.includes(c));
  const bestT = (pid, c) => { if (!c) return null; const l = S.pub.times.filter(t => t.c === c.id && validT(t) && t.p.length === 1 && t.p[0] === pid && xIn(t.d)); if (!l.length) return null; return l.reduce((a, b) => b.t < a.t ? b : a); };
  const rows = Object.keys(S.pub.people).map(pid => ({pid, r: rounds(pid), main: bestT(pid, c33), fx: fixed.map(c => bestT(pid, c)), ex: extraCats.map(c => bestT(pid, c))}))
    .filter(x => x.r.length || x.main || x.fx.some(Boolean) || x.ex.some(Boolean)).sort((a, b) => firstSeen(a.pid).localeCompare(firstSeen(b.pid)));

  const duoCol = k => cAE + (k === 0 ? 0 : 3 + (k - 1) * 2);               // AE/AF, dann AH/AI, AJ/AK …
  const extraCol = k => duoCol(Math.max(1, duoCats.length)) + 2 + k;
  const duoBest = c => { const m = {}; for (const t of S.pub.times) if (t.c === c.id && validT(t) && xIn(t.d)) { const k = pkey(t.p); if (!m[k] || t.t < m[k].t) m[k] = t; } return Object.values(m).sort((a, b) => a.t - b.t); };
  const duos = duoCats.map(duoBest);

  hdr[cV] = H('Nachname'); hdr[cV + 1] = H('Name'); hdr[cX] = H('Zeit'); hdr[cY] = H('Prozente'); hdr[cZ] = H('Anmerkungen');

  duoCats.forEach((c, k) => { hdr[duoCol(k)] = H('Duo'); hdr[duoCol(k) + 1] = H('Exzeit ' + c.name.replace(/^Duo\s*/i, '').replace(/[()]/g, '').replace(/\s*l$/, '').trim()); });
  extraCats.forEach((c, k) => { hdr[extraCol(k)] = H('Exzeit ' + c.name); });

      if (x.r.length) { row[cR] = {f: `MAX(C${ri}:${C(1 + R)}${ri})`}; row[cS] = {f: `AVERAGE(C${ri}:${C(1 + R)}${ri})`, s: 3}; }

      if (notes) row[cZ] = notes;
      x.fx.forEach((t, k) => { if (t) row[cAA + k] = {v: t.t, s: 2}; });
      x.ex.forEach((t, k) => { if (t) row[extraCol(k)] = {v: t.t, s: 2}; });
      if (isFinite(fastest)) row[cBJ] = {v: fastest, s: 2};
    }
    duos.forEach((l, k) => { const t = l[i]; if (t) { row[duoCol(k)] = t.p.map(nm).join(' und '); row[duoCol(k) + 1] = {v: t.t, s: 2}; } });
    out.push(row);
  }

  widths[cAA] = 13; widths[cAA + 1] = 16.1; widths[cAA + 2] = 12.7; widths[cAE] = 23.4; widths[cAE + 1] = 12.1; widths[cAE + 2] = 43.4; widths[cAE + 3] = 20.8;

}

/* Wo gilt welche Erklärung? Erst feste Stellen, dann nach Überschrift */
const INFO_AT = [['#gwMode', 'gwMode'], ['#gwPer,#gwYearC,#gwSince', 'gwPer'], ['#gwCat', 'gwCat'], ['#gwView,#eloBox', 'elo'], ['#sumBox', 'gw'],

const INFO_TXT = [[/Elo/, 'elo'], [/Teamgröße/, 'tsz'], [/Heiße Hand|Serien|Trefferserie|mind\. 1 Treffer/, 'kons'], [/Wurfstatistik|Turnier-Würfe/, 'throws'],
  [/Biere|Strafbier/, 'beers'], [/Turnier/, 'tour'], [/Ex-Zeit|0,33|0,5/, 'ex'], [/Duos|Siegesrate|Spiele/, 'games'], [/Gesamtwertung/, 'gw']];
function infoKey(el) {
  if (!el || !el.closest) return null;
  /* Beim Erfassen wird schnell getippt (✓ ✗ ↩, Stoppuhr) – dort keine Erklärungen */
  if (el.closest('#rows, [data-a], #swGo, #swR, #swd, .sw, input, select, textarea')) return null;
  const tagged = el.closest('[data-info]'); if (tagged) return tagged.dataset.info;
  for (const [sel, k] of INFO_AT) if (el.closest(sel)) return k;
  const box = el.closest('.card,.ocard,.rel,section,#sheetBody'); if (!box) return null;
  const head = (el.closest('.card,.ocard,.rel') || box).querySelector('b,h3,h2,.rh');
  const txt = (head ? head.textContent : '') + ' ' + ((el.closest('h3,h2,b,.rh') || {}).textContent || '');
  for (const [re, k] of INFO_TXT) if (re.test(txt)) return k;
  const h2 = $('#sheetBody h2'); if (el.closest('#sheetBody') && h2) for (const [re, k] of INFO_TXT) if (re.test(h2.textContent)) return k;
  return null;
}
function showInfo(k) {
  const it = INFO[k]; if (!it) return false;
  let pop = $('#infoPop'); if (!pop) { pop = document.createElement('div'); pop.id = 'infoPop'; document.body.appendChild(pop); }
  pop.innerHTML = `<div class="ibox"><button class="xbtn" aria-label="Schließen">✕</button><h3>ⓘ ${it[0]}</h3><div class="itext">${it[1]()}</div></div>`;
  pop.classList.add('on'); pop.onclick = e => { if (e.target === pop || e.target.closest('.xbtn')) pop.classList.remove('on'); };
  return true;
}
(() => {
  let tm = null, sx = 0, sy = 0, fired = 0, downK = null, downT = 0;
  /* Doppelt tippen selbst erkennen – der erste Tipp kann die Stelle neu zeichnen, dann feuert der Browser kein dblclick */
  let px = 0, py = 0;
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#infoPop')) return;
    const k = infoKey(e.target), now = Date.now();
    if (downK && now - downT < 400 && Math.abs(e.clientX - px) + Math.abs(e.clientY - py) < 30) { const k1 = downK; downK = null; if (showInfo(k1)) { fired = now; setTimeout(() => { const s2 = getSelection && getSelection(); s2 && s2.removeAllRanges(); }, 0); } return; }
    downK = k; downT = now; px = e.clientX; py = e.clientY;
  }, true);
  document.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; const t = e.touches[0]; sx = t.clientX; sy = t.clientY; const target = e.target;
    clearTimeout(tm); tm = setTimeout(() => { const k = infoKey(target); if (k && showInfo(k)) { fired = Date.now(); navigator.vibrate && navigator.vibrate(15); } }, 550); }, {passive: true});
  const stop = () => clearTimeout(tm);
  document.addEventListener('touchmove', e => { const t = e.touches[0]; if (Math.abs(t.clientX - sx) + Math.abs(t.clientY - sy) > 10) stop(); }, {passive: true});
  document.addEventListener('touchend', stop, {passive: true}); document.addEventListener('touchcancel', stop, {passive: true});
  document.addEventListener('click', e => { if (Date.now() - fired < 450) { e.preventDefault(); e.stopPropagation(); } }, true);
  document.addEventListener('contextmenu', e => { if (Date.now() - fired < 900 || infoKey(e.target)) e.preventDefault(); });
})();

  }, $('#err'));
  if (S.pub.subTok) $('#off').onclick = () => guarded(async () => { await save('Eintragen ohne Login aus', ctx => { delete ctx.pub.subTok; }); closeSheet(true); });

function setupSheet() {
  const g = guessRepo();
  openSheet(`<h2>Ersteinrichtung</h2><p class="sub">Einmalig: GitHub-Schlüssel hinterlegen und dein Admin-Passwort festlegen. Freigeber legst du danach im Menü an.</p>

    const owner = $('#owner').value.trim(), name = $('#repo').value.trim(), tok = $('#tok').value.trim(), a = $('#a1').value;
    if (!owner || !name || !tok) throw new Error('Bitte Benutzername, Repository und Schlüssel ausfüllen.');
    if (a.length < 10) throw new Error('Passwort bitte mindestens 10 Zeichen.');
    if (a !== $('#a2').value) throw new Error('Die Wiederholung stimmt nicht.');
    let names = {}; const f = $('#nf').files[0];
    if (f) { const j = JSON.parse(await f.text()); if (!j.people) throw new Error('Keine gültige Namensliste.'); names = j.people; }
    S.repo = {owner, name};
    busy(true, 'Prüfe GitHub …'); let info; try { info = await ensureBranch(tok); } finally { busy(false); }
    if (info && info.permissions && !info.permissions.push) throw new Error('Der Schlüssel hat kein Schreibrecht.');
    S.token = tok;
    const built = await buildSecretV2(a, {}, tok);
    S.role = 'admin'; S.KA = built.KA; S.KAraw = built.KAraw; S.me = {id: 'admin', name: 'Admin'};
    S.KN = built.KN; S.KNraw = built.KNraw; S.privRaw = built.privRaw; S.priv = await crypto.subtle.importKey('pkcs8', built.privRaw, {name: 'RSA-OAEP', hash: 'SHA-256'}, false, ['decrypt']);
    await save('Ersteinrichtung', async ctx => {
      if (ctx.secFile) throw new Error('Die App ist bereits eingerichtet.');
      const people = {};
      for (const [id, p] of Object.entries(ctx.pub.people)) people[id] = names[id] ? {f: names[id].f || '', l: names[id].l || ''} : {f: p.s, l: ''};
      ctx.names = people; ctx.pub.repo = {owner, name}; ctx.pub.adminPub = built.pubJwk;
      ctx.newSecret = {...built.file, names: await encJ(built.KN, {people})};
    }, {busyText: 'Richte ein …', quiet: true});
    closeSheet(true); toast('Fertig eingerichtet! Du bist als Admin angemeldet.');
  }, $('#err'));
}
