function editorSheet(eid) {
  const e = eid && S.secret.editors[eid];
  openSheet(`<h2>${e ? esc(e.name) : 'Neuer Freigeber'}</h2><p class="sub">${e ? 'Neues Passwort setzen oder Zugang entfernen.' : 'Name (für dich sichtbar) und ein Passwort, das du ihm gibst.'}</p>
    <div class="field"><label>Name</label><input class="inp" id="nm" value="${esc(e ? e.name : '')}"></div>
    <div class="field"><label>${e ? 'Neues Passwort (leer = bleibt)' : 'Passwort'}</label><input class="inp" id="pw" type="text" autocomplete="off" placeholder="mind. 10 Zeichen"></div>
    <p class="hint">Tipp: z. B. drei Wörter mit Bindestrich, etwa „bier-ball-tor“.</p>
    <h3 class="sect">Darf …</h3>
    ${PERMS.map(([k, n]) => `<label class="check"><input type="checkbox" data-perm="${k}" ${!e || !Array.isArray(e.perm) || e.perm.includes(k) ? 'checked' : ''}> ${n}</label>`).join('')}
    <h3 class="sect">Darf im Profil sehen …</h3>
    <p class="hint" style="margin-top:-4px">Gilt für Bereiche, die unter „👤 Profil-Ansicht“ auf „Freigeber“ stehen. Bereiche für „Alle“ sieht sowieso jeder, „Admin“ nur du.</p>
    ${PSECS.map(([k, n]) => { const vs = e && Array.isArray(e.perm) && e.perm.includes('v-set'); return `<label class="check"><input type="checkbox" data-vis="${k}" ${!vs || e.perm.includes('v:' + k) ? 'checked' : ''}> ${n}${secLvl(k) !== 'editors' ? ' <small style="color:var(--muted)">(steht auf „' + (secLvl(k) === 'all' ? 'Alle' : 'Admin') + '“)</small>' : ''}</label>`; }).join('')}
    <p class="hint">Ohne „Direkt eintragen“ landen seine Einträge wie bei Gästen erst bei den Vorschlägen. Löschen, Personen zusammenführen und Regelwerke bearbeiten bleiben immer beim Admin.</p>
    <div class="err" id="err"></div><button class="btn pri" id="go">Speichern</button>
    ${e ? '<button class="btn danger" id="del">Zugang entfernen</button>' : ''}`);
  $('#go').onclick = () => guarded(async () => {
    const nm = $('#nm').value.trim(), pw = $('#pw').value;
    const perm = [...$('#sheetBody').querySelectorAll('[data-perm]')].filter(x => x.checked).map(x => x.dataset.perm)
      .concat('v-set', [...$('#sheetBody').querySelectorAll('[data-vis]')].filter(x => x.checked).map(x => 'v:' + x.dataset.vis));
    if (!nm) throw new Error('Bitte Namen eingeben.');
    if ((!e || pw) && pw.length < 10) throw new Error('Passwort bitte mindestens 10 Zeichen.');
    await save(e ? 'Freigeber geändert' : 'Freigeber hinzugefügt', async ctx => {
      const f = ctx.secFile, eds = {...(f.editors || {})};
      if (pw) {
        if (await unwrapK(f.admin.wrap, pw, f.iter)) throw new Error('Das ist dein Admin-Passwort – bitte ein anderes nehmen.');
        for (const [id, x] of Object.entries(eds)) if (id !== eid && await unwrapK(x.wrap, pw, f.iter)) throw new Error('Dieses Passwort hat schon ' + x.name + '.');
      }
      if (e) {
        const x = {...eds[eid], name: nm, perm};
        const ki = await aesDec(S.KA, x.kA);
        if (pw) x.wrap = await wrapK(ki, pw);
        // Namens-Schlüssel nur für Freigeber, die volle Namen sehen dürfen
        if (perm.includes('names') && S.KNraw) x.kn = await aesEnc(await importK(ki), S.KNraw); else if (!perm.includes('names')) delete x.kn;
        if (perm.includes('notes')) { const kt = await ensureNotesKey(ctx); x.kt = await aesEnc(await importK(ki), kt); } else delete x.kt;
        eds[eid] = x;
      } else {
        const ki = newRaw(), Ki = await importK(ki);
        eds[rid('e')] = {name: nm, perm, wrap: await wrapK(ki, pw), kA: await aesEnc(S.KA, ki), tok: await encS(Ki, S.token), ...(S.KNraw && perm.includes('names') ? {kn: await aesEnc(Ki, S.KNraw)} : {}), ...(perm.includes('notes') ? {kt: await aesEnc(Ki, await ensureNotesKey(ctx))} : {})};
      }
      ctx.newSecret = {...f, editors: eds};
    }, {okText: e ? 'Gespeichert ✓' : 'Freigeber angelegt ✓ Gib ' + nm + ' jetzt das Passwort.'});
    editorsSheet();
  }, $('#err'));
  if (e) $('#del').onclick = () => guarded(async () => {
    if (!confirm(e.name + ' wirklich entfernen? Das Passwort funktioniert danach nicht mehr.')) return;
    await save('Freigeber entfernt', async ctx => { const eds = {...ctx.secFile.editors}; delete eds[eid]; ctx.newSecret = {...ctx.secFile, editors: eds}; }, {okText: 'Entfernt ✓'});
    editorsSheet();
  }, $('#err'));
}
function adminPwSheet() {
  openSheet(`<h2>Admin-Passwort ändern</h2><p class="sub">Gemerkte Geräte bleiben angemeldet.</p>
    <div class="field"><label>Aktuelles Passwort</label><input class="inp" id="cur" type="password"></div>
    <div class="two"><div class="field"><label>Neues Passwort</label><input class="inp" id="n1" type="password"></div>
    <div class="field"><label>wiederholen</label><input class="inp" id="n2" type="password"></div></div>
    <div class="err" id="err"></div><button class="btn pri" id="go">Speichern</button>`);
  $('#go').onclick = () => guarded(async () => {
    const cur = $('#cur').value, n = $('#n1').value;
    if (n.length < 10) throw new Error('Mindestens 10 Zeichen.');
    if (n !== $('#n2').value) throw new Error('Wiederholung stimmt nicht.');
    await save('Admin-Passwort geändert', async ctx => {
      const f = ctx.secFile, ka = await unwrapK(f.admin.wrap, cur, f.iter);
      if (!ka) throw new Error('Aktuelles Passwort ist falsch.');
      for (const x of Object.values(f.editors || {})) if (await unwrapK(x.wrap, n, f.iter)) throw new Error('Dieses Passwort hat schon ' + x.name + '.');
      ctx.newSecret = {...f, admin: {wrap: await wrapK(ka, n)}};
    });
    closeSheet(true);
  }, $('#err'));
}
function tokenSheet() {
  openSheet(`<h2>GitHub-Schlüssel erneuern</h2><p class="sub">Nötig, wenn der alte abgelaufen ist – oder wenn du jemanden entfernt hast und ganz sicher gehen willst. Neuer Schlüssel: GitHub → Settings → Developer settings → Fine-grained tokens.</p>
    <div class="field"><label>Neuer Schlüssel</label><input class="inp" id="tok" type="password" placeholder="github_pat_…"></div>
    <div class="err" id="err"></div><button class="btn pri" id="go">Speichern</button>`);
  $('#go').onclick = () => guarded(async () => {
    const tok = $('#tok').value.trim(); if (!tok) throw new Error('Bitte Schlüssel eingeben.');
    busy(true, 'Prüfe Schlüssel …'); let info; try { info = await gh('', {}, tok); } finally { busy(false); }
    if (info.permissions && !info.permissions.push) throw new Error('Der Schlüssel hat kein Schreibrecht.');
    const oldTok = S.token; S.token = tok;
    try {
      await save('GitHub-Schlüssel erneuert', async ctx => {
        const f = ctx.secFile, eds = {};
        for (const [id, x] of Object.entries(f.editors || {})) { const Ki = await importK(await aesDec(S.KA, x.kA)); eds[id] = {...x, tok: await encS(Ki, tok)}; }
        ctx.newSecret = {...f, tokA: await encS(S.KA, tok), editors: eds};
      });
    } catch (e) { S.token = oldTok; throw e; }
    closeSheet(true);
  }, $('#err'));
}

/* ---------- Personenauswahl ---------- */
function allPeople() { return Object.keys(S.pub.people).map(id => ({id, name: nameOf(id)})).sort((a, b) => a.name.localeCompare(b.name, 'de')); }
/* Personenauswahl: get() liefert {id} oder {f,l,n} (neu) */
function personPicker(el, label, onPick) {
  let chosen = null;
  const draw = () => {
    if (chosen) {
      el.innerHTML = `<label>${label}</label><div class="sel"><span>${esc(chosen.id ? nameOf(chosen.id) : fullName(chosen) + ' (neu)')}</span><button aria-label="Ändern">✕</button></div>`;
      el.querySelector('button').onclick = () => { chosen = null; draw(); el.querySelector('input').focus(); };
      return;
    }
    el.innerHTML = `<label>${label}</label><input class="inp" placeholder="Name oder Spitzname …" autocomplete="off"><div class="sugg"></div>`;
    const inp = el.querySelector('input'), sg = el.querySelector('.sugg');
    inp.oninput = () => {
      const q = inp.value.trim().toLowerCase(); if (!q) { sg.innerHTML = ''; return; }
      const hits = allPeople().filter(p => p.name.toLowerCase().includes(q) || (S.pub.people[p.id].s || '').toLowerCase().includes(q)).slice(0, 6);
      const parts = inp.value.trim().split(/\s+/);
      const nf = parts.slice(0, -1).join(' ') || parts[0], nl = parts.length > 1 ? parts[parts.length - 1] : '';
      sg.innerHTML = hits.map(p => `<button data-id="${p.id}">${esc(p.name)}</button>`).join('') + `<button data-new="1" style="border-style:dashed">＋ Neue Person anlegen</button>`;
      sg.onclick = e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.id) { chosen = {id: b.dataset.id}; draw(); onPick && onPick(chosen); }
        else newPersonForm(el, nf, nl, p => { chosen = p; draw(); onPick && onPick(chosen); }, draw);
      };
    };
  };
  draw();
  return {get: () => chosen};
}
function newPersonForm(el, f0, l0, done, cancel) {
  el.innerHTML = `<label>Neue Person</label><div class="card" style="margin:0">
    <div class="two"><div class="field"><label>Vorname</label><input class="inp" id="npf" value="${esc(f0)}"></div><div class="field"><label>Nachname</label><input class="inp" id="npl" value="${esc(l0)}"></div></div>
    <div class="field"><label>Spitzname (optional, wird statt des Namens angezeigt)</label><input class="inp" id="npn"></div>
    <p class="hint">${S.role ? '' : 'Den vollen Namen sehen nur Admin und Freigeber.'}</p>
    <div style="display:flex;gap:8px"><button class="btn ghost" id="npc">Abbrechen</button><button class="btn pri" id="npo">Übernehmen</button></div></div>`;
  el.querySelector('#npc').onclick = cancel;
  el.querySelector('#npo').onclick = () => {
    const f = el.querySelector('#npf').value.trim(), l = el.querySelector('#npl').value.trim(), n = el.querySelector('#npn').value.trim();
    if (!f) { el.querySelector('#npf').focus(); return; }
    done({f, l, n});
  };
}
const resolve = (ctx, sel) => sel.map(p => p.id || createPerson(ctx, p));
/* Besucher: neue Personen für den Vorschlag vormerken (Name nur für den Admin lesbar). */
async function proposalPeople(sel, newPeople) {
  const out = [];
  for (const p of sel) {
    if (p.id) { out.push(p.id); continue; }
    const tmp = rid('n');
    newPeople.push({tmp, s: (p.f + (p.l ? ' ' + p.l[0].toUpperCase() + '.' : '')), ...(p.n ? {n: p.n} : {}), enc: await rsaEncrypt({f: p.f, l: p.l})});
    out.push('new:' + tmp);
  }
  return out;
}

const ruleTxt = (kind, id) => ((S.pub.rules || {})[kind] || {})[id] || '';

/* Regelwerk als ganze Seite (für lange Texte) */
function ruleFull(kind, id) {
  const name = kind === 'cat' ? 'Ex: ' + (S.pub.categories.find(c => c.id === id) || {}).name : (SPORTS.find(x => x.id === id) || {}).name;
  const ov = document.createElement('div'); ov.className = 'rulefull';
  ov.innerHTML = `<div class="rfh"><button class="rfx" aria-label="Schließen">‹ Zurück</button><b>📜 ${esc(name || 'Regelwerk')}</b>${isAdmin() ? '<button class="chip" id="rfEd">✎</button>' : '<span></span>'}</div>
    <div class="rfb">${ruleHtml(ruleTxt(kind, id))}</div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const close = () => { ov.remove(); document.body.style.overflow = ''; window.removeEventListener('popstate', close); };
  history.pushState({rf: 1}, ''); window.addEventListener('popstate', close);
  ov.querySelector('.rfx').onclick = () => history.back();
  if (ov.querySelector('#rfEd')) ov.querySelector('#rfEd').onclick = () => { history.back(); setTimeout(() => ruleEditSheet(kind, id, () => { closeSheet(true); ruleFull(kind, id); }), 50); };
}

}

  const catId0 = catPre || defaultCat();
  openSheet(`<h2>Ex-Zeit</h2>

  try { if ($('#by')) $('#by').value = localStorage.getItem('ffd_by') || ''; } catch {}

const NPFIX = {};   // Korrekturen beim Freigeben: key "num|tmp" -> {id} | {f,l,n}

async function decide(nums, ok) {
  const items = S.inbox.filter(i => nums.includes(i.num));
  if (ok && !S.names) for (const it of items) for (const np of it.newPeople) { const fx = NPFIX[it.num + '|' + np.tmp]; if (fx && fx.f && !fx.enc) fx.enc = await rsaEncrypt({f: fx.f, l: fx.l}); }
  const tfiles = [...new Set(items.filter(i => i.kind === 'tres' || (i.kind === 'match' && i.tm)).map(i => 'data/turniere/' + (i.kind === 'tres' ? i.tid : i.tm.tid) + '.json'))];
  const skippedT = [];
  if (ok) {
    await save('Freigegeben: ' + items.length + ' Vorschläge (' + S.me.name + ')', async ctx => {
      for (const it0 of items) {
        const it = withFix(it0), map = {};
        for (const np of it.newPeople) {
          const fx = NPFIX[it.num + '|' + np.tmp];
          if (fx && fx.id && ctx.pub.people[fx.id]) { map['new:' + np.tmp] = fx.id; continue; }
          if (fx && fx.f) {
            map['new:' + np.tmp] = createPerson(ctx, ctx.names ? {f: fx.f, l: fx.l, n: fx.n} : {s: fx.f + (fx.l ? ' ' + fx.l[0].toUpperCase() + '.' : ''), n: fx.n, enc: fx.enc});
            continue;
          }
          let nm = null; if (S.priv && ctx.names) { try { nm = await rsaDecrypt(np.enc); } catch {} }
          map['new:' + np.tmp] = createPerson(ctx, nm ? {f: nm.f, l: nm.l, n: np.n} : {s: np.s, n: np.n, enc: np.enc});
        }
        const fix = p => map[p] || p;
        const by = (it.by ? it.by + ' · ' : '') + 'freigegeben von ' + S.me.name;
        if (it.kind === 'nick') { if (ctx.pub.people[it.pid]) ctx.pub.people[it.pid].n = it.n; continue; }
        if (it.kind === 'match') { const k0 = ctx.skipT || 0; applyMatch(ctx, it, fix, by); if ((ctx.skipT || 0) > k0) skippedT.push(it); continue; }
        if (it.kind === 'game') {
          const tm = x => ({name: x.name, players: x.players.map(fix).filter(q => ctx.pub.people[q])});
          const g = {id: rid('s'), d: it.d, a: tm(it.a), b: tm(it.b), w: it.w, by};
          if (g.a.players.length && g.b.players.length) (ctx.pub.games ||= []).push(g);
          continue;
        }
        if (it.kind === 'tres') {
          const pth = 'data/turniere/' + it.tid + '.json', t = ctx.x[pth];
          if (!t || t.status === 'done') { skippedT.push(it); continue; }
          const m = t.matches.find(x => x.id === it.mid), r = TE.resolve(t)[it.mid];
          if (!m || !r || r.a !== it.a || r.b !== it.b) { skippedT.push(it); continue; }   // Paarung hat sich geändert
          m.res = {w: it.w, ...(typeof it.sa === 'number' ? {sa: it.sa, sb: it.sb} : {}), by, at: new Date().toISOString()}; delete m.f;
          (t.log ||= []).push({at: new Date().toISOString(), by: S.me.name, x: `Ergebnis (Vorschlag von ${it.by}): ${it.an} vs ${it.bn} → ${it.w === it.a ? it.an : it.bn}`});
          ctx.xw.add(pth);
          const ip = 'data/turniere/index.json'; if (ctx.x[ip]) { const i = ctx.x[ip].list.findIndex(x => x.id === t.id); if (i >= 0) ctx.x[ip].list[i] = TE.summary(t); ctx.xw.add(ip); }
          continue;
        }
        if (it.kind === 'time') {
          const p = it.p.map(fix);
          if (!ctx.pub.categories.find(c => c.id === it.c) || p.some(x => !ctx.pub.people[x])) continue;
          ctx.pub.times.push({id: rid('t'), c: it.c, p, t: it.t, d: it.d, by, ...(it.pn ? {r: it.r, pn: it.pn} : {}), ...(it.an ? {an: 1} : {}), ...(it.w ? {w: it.w} : {}),
            ...(it.x ? {cm: [{by: it.by || 'anonym', x: it.x, d: it.d}]} : {})});
        } else if (it.kind === 'comment') {
          const y = ctx.pub.times.find(z => z.id === it.tid); if (y) (y.cm ||= []).push({by: it.by || 'anonym', x: it.x, d: it.d});
        } else {
          for (const [ref, s] of Object.entries(it.data)) { const pid = fix(ref); if (ctx.pub.people[pid]) addChunk(ctx.pub, pid, it.d, s, by, it.k === 't' ? 't' : 'n', it.tid); }
          if (it.game) { const tm = x => ({name: x.name, players: x.players.map(fix).filter(q => ctx.pub.people[q])}); const g = {id: rid('s'), d: it.d, a: tm(it.game.a), b: tm(it.game.b), w: it.game.w, by}; if (g.a.players.length && g.b.players.length) (ctx.pub.games ||= []).push(g); }
          for (const [ref, l] of Object.entries(it.beers || {})) { const pid = fix(ref); if (ctx.pub.people[pid]) for (const n of l) addBeer(ctx.pub, pid, it.d, n, by, it.k, it.tid); }
        }
      }
    }, {okText: skippedT.length ? 'Freigegeben ✓ (' + skippedT.length + ' Turnierergebnis(se) übersprungen – Paarung hatte sich geändert)' : 'Freigegeben ✓', files: tfiles.length ? [...tfiles, 'data/turniere/index.json'] : []});
    if (tfiles.length && window.TOUR) TOUR.tLoadIndex();
  }
  await closeIssues(nums, ok);
  for (const n of nums) delete ITFIX[n];
  S.inbox = S.inbox.filter(i => !nums.includes(i.num)); render();
  if (!ok) toast('Abgelehnt');
}
/* Entfernt Würfe [start, start+len) aus der (ggf. nach Jahr gefilterten) Wurfreihe einer Person */
function deleteThrows(pub, pid, start, len, expect, k = 'n') {
  const list = chunks(pub, pid).map(c => ({...c, s: [...c.s]}));
  const pos = [];
  list.forEach((c, ci) => { if (inYear(c.d) && kindOf(c) === k && szOk(c, pid)) c.s.forEach((_, j) => pos.push([ci, j])); });
  const sel = pos.slice(start, start + len);
  if (sel.map(([ci, j]) => list[ci].s[j]).join('') !== expect) throw new Error('Die Würfe haben sich inzwischen geändert – bitte neu laden und nochmal versuchen.');
  for (const [ci, j] of sel) list[ci].s[j] = '';
  const out = list.map(c => ({...c, s: c.s.join('')})).filter(c => c.s);
  if (out.length) pub.throws[pid] = out; else delete pub.throws[pid];
}
/* Würfe [start, start+len) durch eine gleich lange neue Folge ersetzen (Treffer/Daneben korrigieren) */
function setThrows(pub, pid, start, expect, repl, k = 'n') {
  const list = chunks(pub, pid).map(c => ({...c, s: [...c.s]}));
  const pos = [];
  list.forEach((c, ci) => { if (inYear(c.d) && kindOf(c) === k && szOk(c, pid)) c.s.forEach((_, j) => pos.push([ci, j])); });
  const sel = pos.slice(start, start + expect.length);
  if (sel.map(([ci, j]) => list[ci].s[j]).join('') !== expect || repl.length !== expect.length) throw new Error('Die Würfe haben sich inzwischen geändert – bitte neu laden und nochmal versuchen.');
  sel.forEach(([ci, j], i) => { list[ci].s[j] = repl[i]; });
  pub.throws[pid] = list.map(c => ({...c, s: c.s.join('')}));
  // Treffer im zugehörigen Spiel mitkorrigieren
  for (const gid of new Set(sel.map(([ci]) => list[ci].g).filter(Boolean))) {
    const g = (pub.games || []).find(x => x.id === gid), st = g && (g.s || {})[pid];
    if (st) st.h = pub.throws[pid].filter(c => c.g === gid).reduce((a, c) => a + [...c.s].filter(x => x === '1').length, 0);
  }
}
function addChunk(pub, pid, d, s, by, k = 'n', tid, gid) {
  const list = chunks(pub, pid).map(c => ({...c}));
  const last = list[list.length - 1], tt = k === 't' && tid ? tid : undefined;
  // Würfe aus einem Spiel bekommen die Spiel-ID (g) – so lassen sie sich beim Löschen des Spiels mit entfernen
  if (last && !gid && !last.g && last.d === d && (last.by || '') === (by || '') && kindOf(last) === k && (last.t || undefined) === tt) last.s += s;
  else list.push({d, s, ...(by ? {by} : {}), ...(k === 't' ? {k: 't'} : {}), ...(tt ? {t: tt} : {}), ...(gid ? {g: gid} : {})});
  pub.throws[pid] = list;
}

    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; };

/* ---------- Diagramm & Profil ---------- */
/* Geglätteter Trend: Gauß-gewichteter gleitender Durchschnitt */
function smoothed(ys) {
  const n = ys.length, bw = Math.max(1.2, n / 6);
  return ys.map((_, i) => { let a = 0, w = 0; ys.forEach((y, j) => { const k = Math.exp(-((i - j) ** 2) / (2 * bw * bw)); a += k * y; w += k; }); return a / w; });
}
/* Weiche Kurve durch Punkte (Catmull-Rom → Bézier) */
function curvePath(pts) {
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function lineChart(points, {fmt, lowerBetter = false, maxY = null, minY = null, band = null} = {}) {
  if (points.length < 2) return '';
  const W = 320, H = 120, pl = 40, pr = 10, pt = 10, pb = 22;
  const ys = points.map(p => p.y);
  let lo = minY ?? Math.min(...ys), hi = maxY ?? Math.max(...ys);
  if (hi === lo) { hi += 1; lo -= 1; }
  const pad = (hi - lo) * 0.08; if (minY == null) lo -= pad; if (maxY == null) hi += pad;
  const X = i => pl + (W - pl - pr) * (i / (points.length - 1));
  const Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1];
  const path = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const bi = lowerBetter ? ys.indexOf(Math.min(...ys)) : ys.indexOf(Math.max(...ys));
  const tr = points.length >= 3 ? curvePath(smoothed(ys).map((v, i) => [X(i), Y(v)])) : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" class="grid"/><text x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end" class="ax">${fmt(t)}</text>`).join('')}
    <text x="${pl}" y="${H - 6}" class="ax">${esc(points[0].label)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" class="ax">${esc(points[points.length - 1].label)}</text>
    ${band ? `<rect x="${pl}" width="${W - pl - pr}" y="${Y(Math.min(hi, band[1]))}" height="${Math.max(0, Y(Math.max(lo, band[0])) - Y(Math.min(hi, band[1])))}" class="band"/>` : ''}
    ${tr ? `<path d="${tr}" class="trend"/>` : ''}<path d="${path}" class="ln${tr ? ' raw' : ''}"/>
    ${points.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i === bi ? 5.5 : 4}" class="pt ${i === bi ? 'best' : ''}"/><circle cx="${X(i)}" cy="${Y(p.y)}" r="14" class="hit" data-tip="${esc(p.label + ': ' + fmt(p.y))}"/>`).join('')}
  </svg>${tr ? `<div class="legend"><span><i class="lr"></i>Werte</span><span><i class="lt"></i>Trend</span>${band ? '<span><i class="lb"></i>typischer Bereich</span>' : ''}</div>` : ''}<div class="tip">Punkt antippen für Details${lowerBetter ? ' · weiter unten = schneller' : ''}</div></div>`;
}

/* Würfe eines Spiels aus der Wurfstatistik entfernen. Neue Spiele: über die Spiel-ID (g).

function removeGameThrows(pub, g) {
  let removed = 0, missed = 0;
  for (const pid of gPlayers(g)) {
    const list = chunks(pub, pid); if (!list.length) continue;
    const tagged = list.filter(c => c.g === g.id);
    if (tagged.length) { removed += tagged.reduce((a, c) => a + c.s.length, 0); pub.throws[pid] = list.filter(c => c.g !== g.id); continue; }
    const st = (g.s || {})[pid]; if (!st || !st.n) continue;
    const k = g.k === 't' ? 't' : 'n';
    const idx = [...list.keys()].reverse().find(i => { const c = list[i]; return !c.g && c.d === g.d && kindOf(c) === k && (c.by || '') === (g.by || '') && c.s.length >= st.n && [...c.s.slice(-st.n)].filter(x => x === '1').length === st.h; });
    if (idx == null) { missed++; continue; }
    const c = {...list[idx], s: list[idx].s.slice(0, -st.n)}, nl = list.map((x, i) => i === idx ? c : x).filter(x => x.s.length);
    pub.throws[pid] = nl; removed += st.n;
  }
  return {removed, missed};
}

}

/* ---------- Spielmodus: jedes Spiel einzeln (Würfe, Teams, Sieger, Strafbiere, Team-Treffer pro Bier) ---------- */
const GAME = {players: [], kind: 'n'};
/* Turnier für Turnier-Würfe: automatisch das aktuellste, außer heute wurde von Hand ein anderes gewählt */
function gameTid() {
  const L = tourChoices();
  if (GAME.tid !== undefined && GAME.tidDay === today() && (GAME.tid === '' || L.some(x => x.id === GAME.tid))) return GAME.tid;
  return defaultTid();
}
const GKEYS = ['players', 'newPeople', 'kind', 'tid', 'tidDay', 'teamsOn', 'teams', 'win', 'ext', 'extName', 'extWin', 'pen', 'tb', 'cut', 'active', 'last', 'tm'];
try {
  const g = JSON.parse(localStorage.getItem('ffd_game') || '{}');
  if (Array.isArray(g)) GAME.players = g; else for (const k of GKEYS) if (g[k] !== undefined) GAME[k] = g[k];
  GAME.kind = GAME.kind === 't' ? 't' : 'n'; GAME.players ||= []; GAME.newPeople ||= [];
} catch {}
const saveGame = () => { try { localStorage.setItem('ffd_game', JSON.stringify(Object.fromEntries(GKEYS.map(k => [k, GAME[k] ?? null])))); } catch {} };
const gameLive = () => GAME.players.length && (GAME.active || GAME.players.some(p => (S.local[p] || '').length));
function gameName(p) { if (p.startsWith('g:')) return p.slice(2) + ' (Gast)'; if (p.startsWith('new:')) { const np = (GAME.newPeople || []).find(x => 'new:' + x.tmp === p); return np ? (np.n || np.s) + ' (neu)' : 'Neu'; } return nameOf(p); }
const validRef = p => S.pub.people[p] || p.startsWith('g:') || (p.startsWith('new:') && (GAME.newPeople || []).some(x => 'new:' + x.tmp === p));
function resetGameStats() { GAME.pen = {}; GAME.tb = {}; GAME.cut = {}; GAME.win = ''; GAME.extWin = ''; GAME.tm = null; }

/* Einstieg: laufendes Spiel fortsetzen oder neues Spiel starten */
function gameSheet(preselect) {
  GAME.players = GAME.players.filter(validRef);
  if (preselect && preselect.length) {
    if (gameLive()) { for (const p of preselect) if (!GAME.players.includes(p)) GAME.players.push(p); saveGame(); return gamePlay(); }
    return startGame(preselect, null);
  }
  if (gameLive()) return gamePlay();
  newGameSheet();
}
function startGame(players, teams, opts = {}) {
  resetGameStats();
  GAME.players = [...players]; GAME.active = true;
  if (teams) { GAME.teamsOn = true; GAME.teams = JSON.parse(JSON.stringify(teams)); }
  else if (GAME.teams) for (const k of ['a', 'b']) GAME.teams[k].players = GAME.teams[k].players.filter(p => players.includes(p));
  if (opts.tm) { GAME.tm = opts.tm; GAME.kind = 't'; GAME.tid = opts.tm.tid; GAME.tidDay = today(); }
  GAME.hd = !opts.tm;
  saveGame(); gamePlay();
}
function newGameSheet() {

  const lt = GAME.last && GAME.last.teamsOn && GAME.last.teams;
  const tl = k => lt ? `<b>${esc(lt[k].name)}</b>: ${esc(lt[k].players.filter(p => S.pub.people[p]).map(nameOf).join(', ') || '–')}` : '';

function gamePick(fresh) {

/* Teams */
function gameTeams() {
  GAME.teams ||= {a: {name: 'Team A', players: []}, b: {name: 'Team B', players: []}};
  for (const k of ['a', 'b']) GAME.teams[k].players = GAME.teams[k].players.filter(p => GAME.players.includes(p));
  return GAME.teams;
}
/* Spieler zufällig oder ausgeglichen (Gesamtwertung / Elo) auf Team A und B verteilen */
function splitTeams(basis) {
  const T = gameTeams(), pl = [...GAME.players];
  let st = {};
  if (basis === 'gw') { const c = (S.pub.categories.find(x => !x.duo && /0[,.]33/.test(x.name)) || S.pub.categories[0] || {}).id; st = Object.fromEntries(overall({mode: 'avg', per: 'all', cat: c}).rows.map(r => [r.pid, r.sum])); }
  if (basis === 'elo' && window.TOUR) st = Object.fromEntries(Object.entries(TOUR.elo()).map(([p, x]) => [p, x.r]));
  const known = Object.values(st).sort((a, b) => a - b), med = known.length ? known[Math.floor(known.length / 2)] : 0;
  const val = p => basis === 'rand' ? Math.random() : (st[p] ?? med) + Math.random() * (basis === 'elo' ? 30 : 8);
  const order = pl.map(p => [p, val(p)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const A = [], B = [];
  order.forEach((p, i) => ((i % 4 === 0 || i % 4 === 3) ? A : B).push(p));      // Schlange: A B B A A B B A …
  if (Math.random() < .5) { T.a.players = A; T.b.players = B; } else { T.a.players = B; T.b.players = A; }
  GAME.win = '';
}
const teamOf = p => !GAME.teamsOn || !GAME.teams ? '' : GAME.teams.a.players.includes(p) ? 'a' : GAME.teams.b.players.includes(p) ? 'b' : '';
const hitsOf = p => [...(S.local[p] || '')].filter(c => c === '1').length;
/* Team-Treffer: alle Treffer des eigenen Teams (ohne Teams: aller Spieler) in diesem Spiel */
const teamHits = p => { const t = teamOf(p); return GAME.players.filter(q => !GAME.teamsOn || teamOf(q) === t).reduce((a, q) => a + hitsOf(q), 0); };

function gamePlay() {
  const N = S.pub.settings.statSize;
  GAME.pen ||= {}; GAME.tb ||= {}; GAME.cut ||= {};
  const row = p => {
    const x = p.startsWith('new:') || p.startsWith('g:') ? {blocks: [], cur: S.local[p] || '', curHits: hitsOf(p)} : throwStats(p, true, GAME.kind);
    const loc = (S.local[p] || ''), tm = teamOf(p), pen = GAME.pen[p] || 0, tb = GAME.tb[p] || [];
    const since = teamHits(p) - (GAME.cut[p] || 0);
    return `<div class="prow ${tm ? 'tm' + tm : ''}" data-p="${p}">
      ${GAME.teamsOn ? `<button class="tchip ${tm}" data-a="tm" title="Team wechseln">${tm ? tm.toUpperCase() : '–'}</button>` : ''}<div class="nm"><b>${esc(gameName(p))}</b><small>Stat. ${x.blocks.length + 1}: ${x.curHits}/${x.cur.length} von ${N} · Spiel ${hitsOf(p)}/${loc.length}</small>
      <div class="last">${[...loc.slice(-12)].map(c => `<i class="${c === '1' ? 'h' : 'm'}"></i>`).join('')}</div></div>
      <button class="gu" data-a="u" ${loc ? '' : 'disabled'}>↩</button><button class="gb gm" data-a="0">✗</button><button class="gb gh" data-a="1">✓</button>
      <div class="gx">
        <span class="pen">Strafbier <button class="mini" data-a="p-" ${pen ? '' : 'disabled'}>−</button><b>${pen}</b><button class="mini" data-a="p+">+</button></span>
        <button class="mini fin" data-a="f" title="Bier leer – Team-Treffer seit Start dieses Biers übernehmen">🍺 fertig${since ? ' (' + since + ')' : ''}</button>
        ${tb.map((n, i) => `<button class="mini bchip" data-a="fe" data-i="${i}" title="ändern">${i + 1}. Bier: ${n} ✎</button>`).join('')}
      </div></div>`;
  };
  /* Reihenfolge: Team A, Team B, ohne Team – jeweils alphabetisch nach Vorname */
  const order = () => { const r = p => !GAME.teamsOn ? 0 : ({a: 0, b: 1}[teamOf(p)] ?? 2);
    return [...GAME.players].sort((x, y) => r(x) - r(y) || gameName(x).localeCompare(gameName(y), 'de', {sensitivity: 'base'})); };
  const total = () => GAME.players.reduce((a, p) => a + (S.local[p] || '').length, 0);
  const winOk = () => GAME.teamsOn ? (GAME.win === 'a' || GAME.win === 'b') : GAME.ext ? (GAME.extWin === 'w' || GAME.extWin === 'l') : false;
  const svTxt = () => (canDirect() ? '✅ Spiel speichern' : '✅ Spiel einreichen') + (total() ? ' (' + total() + ' Würfe' + (winOk() ? (GAME.ext ? (GAME.extWin === 'w' ? ', Sieg' : ', Niederlage') : ', Sieger') : '') + ')' : '');
  const draw = () => {
    if (!tourOn()) GAME.kind = 'n';
    if (!noTeamsOk() && !GAME.teamsOn && !GAME.ext) { GAME.teamsOn = true; saveGame(); }
    if (GAME.teamsOn) gameTeams();
    const T = GAME.teams, old = GAME.teamsOn && window.TOUR && TOUR.oldTeams ? TOUR.oldTeams().filter(o => o.players.every(p => GAME.players.includes(p))) : [];

    let lockFile = null, K = null;
    if (raw) { K = await importK(raw); lockFile = {v: 1, iter: iterSalt.iter, salt: b64(iterSalt.salt), check: await aesEnc(K, enc.encode('ffd-ok'))}; }
    await save(raw ? 'Seiten-Passwort gesetzt' : 'Seiten-Passwort entfernt', ctx => { ctx.reseal = K; ctx.resealRaw = raw; ctx.lockFile = lockFile; }, {files, okText: raw ? 'Seiten-Passwort aktiv ✓' : 'Seiten-Passwort entfernt'});
    S.KSraw = raw ? b64(raw) : null;
  };
  $('#go').onclick = () => guarded(async () => {
    const a = $('#sp1').value, b = $('#sp2').value;
    if (a.length < 6) throw new Error('Mindestens 6 Zeichen.'); if (a !== b) throw new Error('Die Passwörter stimmen nicht überein.');
    const salt = crypto.getRandomValues(new Uint8Array(16)), iter = ITER, raw = await siteRaw(a, salt, iter);
    await apply(raw, {salt, iter}); sitePwSheet();
  }, $('#err'));
  if ($('#off')) $('#off').onclick = () => guarded(async () => { if (!confirm('Seiten-Passwort wirklich entfernen? Die Daten sind dann wieder für alle lesbar.')) return; await apply(null); sitePwSheet(); }, $('#err'));
  $('#wipe').onclick = () => guarded(async () => {
    if (!confirm('Den kompletten GitHub-Verlauf löschen (nur der aktuelle Stand bleibt) und die Inhalte alter erledigter Vorschläge leeren? Das lässt sich nicht rückgängig machen.')) return;
    busy(true, 'Bereinige …');
    try {
      const ref = await gh('git/ref/heads/' + S.repo.branch), head = await gh('git/commits/' + ref.object.sha);
      const nc = await gh('git/commits', {method: 'POST', body: {message: 'Verlauf bereinigt (Seiten-Passwort aktiv)', tree: head.tree.sha, parents: []}});
      await gh('git/refs/heads/' + S.repo.branch, {method: 'PATCH', body: {sha: nc.sha, force: true}});
      const tok = S.pub.subTok ? deobf(S.pub.subTok) : S.token; let n = 0;
      for (let page = 1; page < 20; page++) {
        const list = await ghIssues('?state=closed&per_page=100&page=' + page, {}, tok); if (!list.length) break;
        for (const i of list) if (!i.pull_request && (i.title || '').startsWith('[FFD]') && !/"ffdenc"/.test(i.body || '') && i.body !== '(entfernt)') { try { await ghIssues('/' + i.number, {method: 'PATCH', body: {title: '[FFD] Vorschlag', body: '(entfernt)'}}, tok); n++; } catch {} }
      }
      toast('Bereinigt ✓ ' + n + ' alte Vorschläge geleert');
    } finally { busy(false); }
  }, $('#err'));
}

async function start() {
  if (/^#tv=/.test(location.hash) && window.TOUR) return TOUR.viewStart();
  await unlockSite();
  if (/^#beamer/.test(location.hash) && window.TOUR) { try { S.pub = await fetchJSON('data/public.json'); S.repo = guessRepo(); } catch {} return TOUR.beamerStart(); }
  try { S.pub = await fetchJSON('data/public.json'); if (!S.pub) throw new Error(); }
  catch { document.querySelector('.wrap').innerHTML = '<div class="empty" style="margin-top:40px">Daten konnten nicht geladen werden.<br>Bitte Internetverbindung prüfen.</div>'; return; }
  S.pub.throws ||= {}; ensureOther(S.pub);
  S.cat = S.pub.categories[0] && S.pub.categories[0].id;
  S.repo = guessRepo(); loadLocalThrows();
  render();
  if (window.TOUR) TOUR.tLoadIndex().then(() => { if (S.view === 'tour') render(); }).catch(() => {});
  try {
    const a = JSON.parse(localStorage.getItem('ffd_auth') || 'null');
    if (a && a.k) {
      S.secret = await fetchJSON('data/secret.json');
      if (S.secret && S.secret.v === 2) {
        try { if (a.role === 'admin') await setAdmin(unb64(a.k)); else await setEditor(a.eid, unb64(a.k)); render(); await loadLive(); }
        catch { localStorage.removeItem('ffd_auth'); logout(true); toast('Zugang geändert – bitte neu anmelden'); }
      } else localStorage.removeItem('ffd_auth');
    }
  } catch {}
}
start();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
